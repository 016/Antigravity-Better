		},

		hashString(str) {
			let hash = 5381;
			for (let i = 0; i < str.length; i++) {
				hash = ((hash << 5) + hash) + str.charCodeAt(i);
				hash = hash & hash;
			}
			return 'h_' + Math.abs(hash).toString(36);
		},

		getSessionFingerprint(panel, sessionRoot, validTurns) {
			const roots = [sessionRoot, panel].filter(Boolean);
			const stableSessionAttrs = ['data-conversation-id', 'data-session-id', 'data-chat-id', 'data-thread-id'];
			for (const root of roots) {
				if (!root.getAttribute) continue;
				for (const attr of stableSessionAttrs) {
					const value = String(root.getAttribute(attr) || '').trim();
					if (value && value.length < 300) return `${attr}:${value}`;
				}
			}
			const firstUser = validTurns[0] && validTurns[0].userEl
				? String(validTurns[0].userEl.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 120) : '';
			const lastUser = validTurns[validTurns.length - 1] && validTurns[validTurns.length - 1].userEl
				? String(validTurns[validTurns.length - 1].userEl.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 120) : '';
			const firstNodeId = validTurns[0] && validTurns[0].node && validTurns[0].node.id ? validTurns[0].node.id : '';
			if (!firstUser && !lastUser && !firstNodeId) return '';
			return this.hashString(`fallback-session|${location.pathname}|${firstUser}|${firstNodeId}`);
		},

		buildTurnSignature(uText, thText, aiText, toolText = '', turnIdentity = '') {
			const toolSignature = String(toolText || '');
			// 不能只取工具输出前 100 个字符：命令结果常在后面追加，
			// 否则签名不变会让强制补扫把新增的少量 token 永久漏掉。
			const toolPart = toolSignature.length + '|' + toolSignature.slice(0, 200) + '|' + toolSignature.slice(-200);
			return this.hashString((this.currentSessionFingerprint || 'session-unknown') + '|' + turnIdentity + '|' + uText + '|' + thText + '|' + aiText + '|' + toolPart);
		},

		buildTurnIdentity(turnNode, uText, aiText) {
			const nodes = [turnNode];
			if (turnNode && turnNode.querySelector) {
				for (const attr of ['data-message-id', 'data-turn-id', 'data-message-index', 'data-index', 'data-id', 'id']) {
					const nested = turnNode.querySelector(`[${attr}]`);
					if (nested) nodes.push(nested);
				}
			}
			const sessionPart = this.hashString('session|' + (this.currentSessionFingerprint || 'unknown'));
			const stableAttrs = ['data-message-id', 'data-turn-id', 'data-id', 'id'];
			const scopedAttrs = ['data-message-index', 'data-index'];
			for (const node of nodes) {
				if (!node || !node.getAttribute) continue;
				for (const attr of stableAttrs) {
					const value = node.getAttribute(attr);
					if (value && value.length < 300) return 'id:' + attr + ':' + value;
				}
				for (const attr of scopedAttrs) {
					const value = node.getAttribute(attr);
					if (value && value.length < 300) return sessionPart + '|id:' + attr + ':' + value;
				}
			}
			const user = String(uText || '').replace(/\s+/g, ' ').trim();
			const answer = String(aiText || '').replace(/\s+/g, ' ').trim();
			const fallback = user ? 'user:' + user : 'answer:' + answer;
			// 不把 sessionGeneration 放进轮次身份：同一会话切走再切回
			// 时 generation 会递增，但消息本身仍是同一轮，不能因此重计。
			// 当前会话指纹用于降低跨会话相同文本的碰撞概率。
			return this.hashString('turn|' + (this.currentSessionFingerprint || '') + '|' + fallback);
		},

		estimateTokens(str) {
			if (!str) return 0;
			const text = typeof str === 'string' ? str : String(str);
			if (!text.trim()) return 0;
			const cjkMatches = text.match(/[\u4e00-\u9fa5\u3040-\u30ff\uac00-\ud7af]/g);
			const cjkCount = cjkMatches ? cjkMatches.length : 0;
			const symbolMatches = text.match(/[{}\[\]()<>=+\-*\/\\;:,.!?\'\"`~@#\$%\^&|_]/g);
			const symbolCount = symbolMatches ? symbolMatches.length : 0;
			const otherCount = Math.max(0, text.length - cjkCount - symbolCount);
			const tokens = Math.round(cjkCount * 1.25 + symbolCount * 0.8 + otherCount * 0.28);
			return Math.max(1, tokens);
		},

		detectActiveModel(panel) {
			const root = panel || document.querySelector('.antigravity-agent-side-panel') || document.body;
			if (!root) return this.currentModelStr;
			const isVisible = node => {
				if (!node) return false;
				const style = window.getComputedStyle(node);
				if (style.display === 'none' || style.visibility === 'hidden') return false;
				if (!node.getBoundingClientRect) return true;
				const rect = node.getBoundingClientRect();
				return rect.width > 0 && rect.height > 0;
			};

			// 策略 1: 查找 aria-haspopup="dialog" 触发器 (Antigravity 原生底栏模型按钮)
			const popups = root.querySelectorAll('[aria-haspopup="dialog"]');
			for (const p of popups) {
				if (!isVisible(p)) continue;
				const txt = (p.textContent || '').trim();
				if (/^(gemini|claude|gpt|deepseek|qwen)/i.test(txt) && txt.length < 40) {
					this.currentModelStr = txt;
					return txt;
				}
			}

			// 策略 2: 查找带有 chevron-up 的按钮或容器
			const chevrons = root.querySelectorAll('.lucide-chevron-up, [class*="chevron-up"]');
			for (const ch of chevrons) {
				const p = ch.closest('button, div');
				if (p && isVisible(p)) {
					const txt = (p.textContent || '').trim();
					if (/^(gemini|claude|gpt|deepseek|qwen)/i.test(txt) && txt.length < 40) {
						this.currentModelStr = txt;
						return txt;
					}
				}
			}

			// 策略 3: 检查弹窗中当前选中的模型 (class 含 bg-gray-500/20)
			const activeDialogItem = document.querySelector('div[role="dialog"] div[class*="bg-gray-500/20"] span, div[role="dialog"] div.bg-gray-500\\/20 span');
			if (activeDialogItem && isVisible(activeDialogItem) && activeDialogItem.textContent.trim()) {
				this.currentModelStr = activeDialogItem.textContent.trim();
				return this.currentModelStr;
			}
			return this.currentModelStr;
		},

		hookNetwork() {
			if (this.networkHooked) return;
			this.networkHooked = true;
			const self = this;
			const extractModel = (body, seen = new WeakSet()) => {
				if (!body) return '';
				if (typeof body === 'string') {
					try {
						const parsed = JSON.parse(body);
						const nested = extractModel(parsed, seen);
						if (nested) return nested;
					} catch (e) {}
				const match = body.match(/"(?:model|modelName|model_id)"\s*:\s*"([^"]+)"/i);
				return match ? match[1] : '';
				}
				try {
					if (typeof URLSearchParams !== 'undefined' && body instanceof URLSearchParams) return body.get('model') || body.get('model_id') || '';
					if (typeof body !== 'object' || seen.has(body)) return '';
					seen.add(body);
					for (const key of ['model', 'modelName', 'model_id']) {
						if (typeof body[key] === 'string' && body[key].trim()) return body[key].trim();
					}
					for (const value of Object.values(body)) {
						const nested = extractModel(value, seen);
						if (nested) return nested;
					}
				} catch (e) {}
				return '';
			};
			const getUrl = (request) => typeof request === 'string' ? request : (request && request.url ? request.url : '');
			const modelFromUrl = (url) => {
				if (!url) return '';
				const match = url.match(/(?:models\/|(?:model|model_id)[=:])([^\/:?&]+)/i);
				if (!match) return '';
				try { return decodeURIComponent(match[1]); } catch (e) { return match[1]; }
			};
			const isUsageUrl = (url) => /generateContent|streamGenerateContent|chat\/completions|\/messages(?:[/?]|$)|v1internal/i.test(url || '');

			try {
				const origFetch = window.fetch;
				if (typeof origFetch === 'function') {

						const url = getUrl(request);

						const reqModelStr = extractModel(body) || modelFromUrl(url);
						const requestGeneration = self.sessionGeneration;
						const requestKey = `${requestGeneration}:${++self.networkRequestSeq}:${url}`;
						const resp = await origFetch.apply(this, args);

									requestKey, url, sessionGeneration: requestGeneration
									});
								}).catch(() => {});
							}
						} catch (e) {}
						return resp;
					};
				}
			} catch (e) { console.warn('[AB Analytics] fetch 计量钩子安装失败:', e); }

			// 部分 IDE 版本使用 XMLHttpRequest；覆盖它可避免仅依赖 fetch 而漏掉整段会话。
			try {
				const xhrProto = window.XMLHttpRequest && window.XMLHttpRequest.prototype;
				if (xhrProto && !xhrProto._abUsageHooked) {

					const origSend = xhrProto.send;
					xhrProto._abUsageHooked = true;

						const requestKey = `${requestGeneration}:${++self.networkRequestSeq}:${url}`;
						if (isUsageUrl(url)) {

								if (xhr.status >= 400) return;
								try {

										if (typeof raw === 'string') self.parseAndExtractTokens(raw, reqModelStr || responseModel, {
										requestKey, url, sessionGeneration: requestGeneration
										});
								} catch (e) {}
							}, { once: true });
						}
						return origSend.call(this, body);
					};
				}
			} catch (e) { console.warn('[AB Analytics] XHR 计量钩子安装失败:', e); }
		},

		parseAndExtractTokens(rawText, modelStr, context = null) {
			if (!rawText || typeof rawText !== 'string') return;
			const contextGeneration = context && typeof context === 'object' && Number.isInteger(Number(context.sessionGeneration))
				? Number(context.sessionGeneration) : null;
			if (contextGeneration !== null && contextGeneration !== this.sessionGeneration) return;
			const usageObjects = [];
			const seenObjects = new WeakSet();
			const usageKeys = new Set(['promptTokenCount', 'candidatesTokenCount', 'thoughtsTokenCount', 'thoughts_tokens', 'toolUsePromptTokenCount', 'tool_use_prompt_tokens', 'cachedContentTokenCount', 'totalTokenCount', 'prompt_tokens', 'completion_tokens', 'input_tokens', 'output_tokens', 'cached_tokens', 'cache_read_input_tokens', 'cache_creation_input_tokens', 'ephemeral_5m_input_tokens', 'ephemeral_1h_input_tokens', 'total_tokens', 'reasoning_tokens']);
			const addObjects = (value) => {
				if (!value || typeof value !== 'object') return;
				if (seenObjects.has(value)) return;
				seenObjects.add(value);
				if (value.usageMetadata && typeof value.usageMetadata === 'object') addObjects(value.usageMetadata);
				if (value.usage && typeof value.usage === 'object') addObjects(value.usage);
				if (Object.keys(value).some(key => usageKeys.has(key))) usageObjects.push(value);
				Object.keys(value).forEach(key => {
					if (value[key] && typeof value[key] === 'object') addObjects(value[key]);
				});
			};
			const payloads = [];
			const sseData = [];
			const flushSseData = () => {
				if (!sseData.length) return;
				const jsonText = sseData.join('\n').trim();
				sseData.length = 0;
				if (!jsonText || jsonText === '[DONE]') return;
				try { payloads.push(JSON.parse(jsonText)); } catch (e) {}
			};
			for (const line of rawText.split(/\r?\n/)) {
				if (/^\s*data:\s*/i.test(line)) {
					// 正常 SSE 用空行分隔 event，但部分 Electron/代理层
					// 会省略空行；若当前 data 已经是完整 JSON，先提交它，
					// 再开始下一条，仍保留多行 JSON 的拼接能力。
					if (sseData.length) {
						try { JSON.parse(sseData.join('\n')); flushSseData(); } catch (e) {}
					}
					sseData.push(line.replace(/^\s*data:\s*/i, ''));
				}
				else if (!line.trim()) flushSseData();
			}
			flushSseData();
			if (!payloads.length) {
				// 兼容非 SSE 的 JSONL/NDJSON 响应；普通 JSON 则由下一步
				// 整体解析，避免把嵌套对象拆坏。
				for (const line of rawText.split(/\r?\n/)) {
					try {
						const jsonLine = line.trim();
						if (jsonLine) payloads.push(JSON.parse(jsonLine));
					} catch (e) {}
				}
			}
			if (!payloads.length) {
				try { payloads.push(JSON.parse(rawText.trim())); } catch (e) {}
			}
			payloads.forEach(addObjects);
			if (!usageObjects.length) return;
			let payloadModel = '';
			const findPayloadModel = (value) => {
				if (!value || typeof value !== 'object' || payloadModel) return;
				if (!Array.isArray(value)) {
					for (const key of ['model', 'modelName', 'model_id', 'modelVersion']) {
						if (typeof value[key] === 'string' && value[key].trim()) { payloadModel = value[key].trim(); break; }
					}
				}
				if (!payloadModel) Object.keys(value).forEach(key => findPayloadModel(value[key]));
			};
			payloads.forEach(findPayloadModel);

			const numberFrom = (obj, ...keys) => {
				let max = 0;
				let found = false;
				for (const key of keys) {
					if (obj && obj[key] !== undefined && obj[key] !== null) {
						found = true;
						max = Math.max(max, Math.max(0, Number(obj[key]) || 0));
					}
				}
				return found ? max : 0;
			};
			const nestedNumber = (obj, paths) => {
				let max = 0;
				let found = false;
				for (const path of paths) {
					let current = obj;
					for (const part of path) current = current && current[part];
					if (current !== undefined && current !== null) {
						found = true;
						max = Math.max(max, Math.max(0, Number(current) || 0));
					}
				}
				return found ? max : 0;
			};
			const reportedFor = (usage) => numberFrom(usage, 'totalTokenCount', 'total_tokens');
			const componentFor = (usage) => {
				const prompt = numberFrom(usage, 'promptTokenCount', 'prompt_tokens', 'input_tokens');
				const output = numberFrom(usage, 'candidatesTokenCount', 'completion_tokens', 'output_tokens');
				const thoughts = numberFrom(usage, 'thoughtsTokenCount', 'thoughts_tokens');
				const tool = numberFrom(usage, 'toolUsePromptTokenCount', 'tool_use_prompt_tokens');
				return prompt + output + thoughts + tool;
			};
			// SSE 可能包含多个累计 usage；选累计总量/字段最完整的一条，而不是把不同事件的字段拼起来。
			let usage = usageObjects.reduce((best, candidate) => {
				if (!best) return candidate;
				const bestScore = [reportedFor(best) > 0 ? 1 : 0, reportedFor(best), componentFor(best), Object.keys(best).length];
				const candidateScore = [reportedFor(candidate) > 0 ? 1 : 0, reportedFor(candidate), componentFor(candidate), Object.keys(candidate).length];
				for (let i = 0; i < bestScore.length; i++) {
					if (candidateScore[i] !== bestScore[i]) return candidateScore[i] > bestScore[i] ? candidate : best;
				}

			}, null);

			// Claude 的流式响应通常把 input/cache 放在 message_start，
			// output 放在最后的 message_delta；Gemini 的流式响应也
			// 可能把 usage 字段分散到多个 SSE event。不能只选其中一个对象，
			// 也不能把不同 event 的字段拼成一条“最后一次”记录。
			const hasClaudeEnvelope = payloads.some(value => {
				let found = false;
				const walk = node => {
					if (found || !node || typeof node !== 'object') return;
					if (!Array.isArray(node) && typeof node.type === 'string' && /^message_(?:start|delta|stop)$/i.test(node.type)) {
						found = true;
						return;
					}
					Object.keys(node).forEach(key => { if (!found && node[key] && typeof node[key] === 'object') walk(node[key]); });
				};
				walk(value);
				return found;
			});
			const hasClaudeUsage = hasClaudeEnvelope || usageObjects.some(candidate =>
				['cache_read_input_tokens', 'cache_creation_input_tokens', 'ephemeral_5m_input_tokens', 'ephemeral_1h_input_tokens'].some(key => Object.prototype.hasOwnProperty.call(candidate, key))
			);
			const usageFieldKeys = ['promptTokenCount', 'candidatesTokenCount', 'thoughtsTokenCount', 'toolUsePromptTokenCount', 'cachedContentTokenCount', 'totalTokenCount', 'prompt_tokens', 'completion_tokens', 'input_tokens', 'output_tokens', 'cached_tokens', 'cache_read_input_tokens', 'cache_creation_input_tokens', 'ephemeral_5m_input_tokens', 'ephemeral_1h_input_tokens', 'total_tokens'];
			const hasOwnUsageKey = (obj, keys) => keys.some(key => obj && Object.prototype.hasOwnProperty.call(obj, key));
			if (hasClaudeUsage) {
				// Claude message_start and message_delta deliberately split input/cache
				// from output. Only this envelope is allowed to merge fields across
				// events, and values are cumulative so max() avoids double counting.
				const merged = { ...usage };
				usageFieldKeys.forEach(key => {
					if (usageObjects.some(candidate => Object.prototype.hasOwnProperty.call(candidate, key))) {

					}
				});
				usage = merged;
			}
			// Gemini/OpenAI streaming responses normally expose a cumulative final
			// usage object. Do not combine fields from unrelated events; if the
			// selected object omits one optional field, use that field's maximum only
			// as a missing-field fallback.
			const selectedOrMissingField = (...keys) => {
				if (hasOwnUsageKey(usage, keys)) return numberFrom(usage, ...keys);
				return Math.max(...usageObjects.map(candidate => numberFrom(candidate, ...keys)), 0);
			};
			const selectedNestedOrMissing = paths => {
			const hasNested = paths.some(path => {
				let current = usage;
				for (const part of path) current = current && current[part];
				return current !== undefined && current !== null;
			});
			if (hasNested) return nestedNumber(usage, paths);
			return Math.max(...usageObjects.map(candidate => nestedNumber(candidate, paths)), 0);
			};

			const promptRaw = selectedOrMissingField('promptTokenCount', 'prompt_tokens', 'input_tokens');
			const candidatesOut = selectedOrMissingField('candidatesTokenCount', 'completion_tokens', 'output_tokens');
			const thoughts = selectedOrMissingField('thoughtsTokenCount', 'thoughts_tokens');
			const reasoning = selectedNestedOrMissing([['completion_tokens_details', 'reasoning_tokens'], ['output_tokens_details', 'reasoning_tokens'], ['reasoning_tokens']]);
			const toolUse = selectedOrMissingField('toolUsePromptTokenCount', 'tool_use_prompt_tokens');
			const cacheReadTokens = Math.max(selectedOrMissingField('cachedContentTokenCount', 'cached_tokens', 'cache_read_input_tokens'), selectedNestedOrMissing([['prompt_tokens_details', 'cached_tokens']]));
			const cacheWrite5mFor = candidate => Math.max(numberFrom(candidate, 'ephemeral_5m_input_tokens'), nestedNumber(candidate, [['cache_creation', 'ephemeral_5m_input_tokens']]));
			const cacheWrite1hFor = candidate => Math.max(numberFrom(candidate, 'ephemeral_1h_input_tokens'), nestedNumber(candidate, [['cache_creation', 'ephemeral_1h_input_tokens']]));
			const cacheWrite5mTokens = hasClaudeUsage ? Math.max(cacheWrite5mFor(usage), ...usageObjects.map(cacheWrite5mFor)) : cacheWrite5mFor(usage);
			const cacheWrite1hTokens = hasClaudeUsage ? Math.max(cacheWrite1hFor(usage), ...usageObjects.map(cacheWrite1hFor)) : cacheWrite1hFor(usage);
			const cacheWriteTokens = Math.max(numberFrom(usage, 'cache_creation_input_tokens'), cacheWrite5mTokens + cacheWrite1hTokens);
			let inTokens = promptRaw + toolUse;
			let outTokens = candidatesOut + thoughts;
			let unclassifiedTokens = 0;
			let totalComponentMismatch = false;
			// 某些 provider 的 completion_tokens 已包含 reasoning_tokens；只有没有总 output
			// 字段时才把 reasoning 单独计入，避免重复计量。
			if (candidatesOut === 0) outTokens += reasoning;
			if (hasClaudeUsage && usage.input_tokens !== undefined) {
				// Claude 的 input_tokens 只表示 cache breakpoint 之后的输入。
				inTokens += cacheReadTokens + cacheWriteTokens;
			}
			const reportedTotal = reportedFor(usage);
			if (reportedTotal > 0 && inTokens === 0 && outTokens > 0) inTokens = Math.max(0, reportedTotal - outTokens);
			else if (reportedTotal > inTokens + outTokens) {
				unclassifiedTokens = reportedTotal - inTokens - outTokens;
				inTokens += unclassifiedTokens;
			} else if (reportedTotal > 0 && reportedTotal < inTokens + outTokens) {
				// provider 的 total 小于已识别字段时，通常意味着某个
				// output/reasoning 字段是包含关系；保留可观测字段，但
				// 不再把费用宣称为完整账单。
				totalComponentMismatch = true;
			}
			if (cacheReadTokens + cacheWriteTokens > inTokens) inTokens = cacheReadTokens + cacheWriteTokens;
			if (!(inTokens > 0 || outTokens > 0)) return;

			const usageModel = usage.model || usage.modelName || usage.model_id || usage.modelVersion || '';
			// 响应 usage/payload 是实际执行模型的优先证据；请求中的别名或
			// 当前 UI 选择只能作为最后回退。若 usage 只返回内部别名，则继续
			// 尝试 payload/request 中可解析的模型，避免已知模型被误判为 unknown。
			const modelCandidates = [usageModel, payloadModel, modelStr].filter(value => typeof value === 'string' && value.trim());
			const detectedModel = modelCandidates.find(value => PricingManager.resolve(value)) || modelCandidates[0] || '';
			const modelPricing = PricingManager.resolve(detectedModel);
			const modelId = modelPricing ? modelPricing.id : 'unknown';
			const modelName = modelPricing ? modelPricing.name : (detectedModel || t('unknown_model'));
			const requestKey = context && typeof context === 'object' ? context.requestKey : (typeof context === 'string' ? context : '');
			// 用归一化后的 usage 数值生成指纹；不能依赖被选中的单个
			// SSE 对象，否则同一响应重试解析时可能因对象顺序/分段不同
			// 产生第二条记录。
				const usageFingerprint = [promptRaw, candidatesOut, thoughts, reasoning, toolUse, cacheReadTokens, cacheWriteTokens, cacheWrite5mTokens, cacheWrite1hTokens, reportedTotal].join(':');
				const fingerprint = this.hashString(usageFingerprint);
				const dedupeKey = `${requestKey || `manual:${this.hashString(rawText)}`}|${modelId}|${fingerprint}`;
				const usageGeneration = contextGeneration === null ? this.sessionGeneration : contextGeneration;
				if (usageGeneration !== this.sessionGeneration) return;
				if (this.networkUsageKeys.has(dedupeKey)) return;
				this.networkUsageKeys.add(dedupeKey);
				if (this.networkUsageKeys.size > 5000) this.networkUsageKeys.delete(this.networkUsageKeys.values().next().value);
				const observedAt = Date.now();
				this.networkUsageSeen = true;
				this.networkUsageSeenAt = observedAt;

			// 记录响应文本指纹，供 DOM 后备扫描判断该轮是否已有 provider usage。
			const outputTexts = [];
			const collectOutputText = (value, inOutput = false) => {
				if (!value || typeof value !== 'object') return;
				if (Array.isArray(value)) { value.forEach(item => collectOutputText(item, inOutput)); return; }
				const outputScope = inOutput || Array.isArray(value.candidates) || Array.isArray(value.choices) || value.role === 'model' || value.role === 'assistant';
				Object.keys(value).forEach(key => {
					const child = value[key];
					if ((key === 'text' || key === 'content') && outputScope && typeof child === 'string' && child.trim()) outputTexts.push(child.trim());
					else if (child && typeof child === 'object') collectOutputText(child, outputScope || key === 'content' || key === 'parts' || key === 'message' || key === 'delta');
				});
			};
			payloads.forEach(value => collectOutputText(value));
			// SSE 的每个 chunk 可能只有几个字；同时保存拼接后的响应正文，
			// 让 DOM 后备层能用完整回答关联 provider usage，而不是依赖某个
			// 短 chunk 恰好出现在最终正文中。
			if (outputTexts.length > 1) outputTexts.push(outputTexts.join(''));
				const pendingOutputTexts = [];
				outputTexts.forEach(text => {
					const normalized = text.replace(/\s+/g, ' ').trim();
					if (normalized && !this.networkOutputTexts.includes(normalized) && !pendingOutputTexts.includes(normalized)) {
						pendingOutputTexts.push(normalized);
					}
				});
				const registerSavedOutputTexts = () => {
					pendingOutputTexts.forEach(output => {
						if (!this.networkOutputTexts.includes(output)) this.networkOutputTexts.push(output);
					});
					if (this.networkOutputTexts.length > 300) this.networkOutputTexts.splice(0, this.networkOutputTexts.length - 300);
				};

				let cost = null;
				const pricingUsable = modelPricing && modelPricing.pricingValid !== false;
				if (pricingUsable) {
				const isLongContext = inTokens > 200000;
				const pInput = isLongContext && modelPricing.input_200k !== undefined ? modelPricing.input_200k : modelPricing.input;
				const pOutput = isLongContext && modelPricing.output_200k !== undefined ? modelPricing.output_200k : modelPricing.output;
					const pCacheRead = isLongContext && modelPricing.cache_200k !== undefined ? modelPricing.cache_200k : modelPricing.cacheRead;
					const billableInput = Math.max(0, inTokens - cacheReadTokens - cacheWriteTokens);
					// Claude 只返回总 cache_creation_input_tokens 而没有 TTL 拆分时，
					// 不能擅自按 5 分钟写入价计费；该部分从“已知小计”中排除，
					// 并通过 costKnown=false 明确提示金额仍不完整。
					const pCacheWrite5m = modelPricing.cacheWrite5m !== undefined ? modelPricing.cacheWrite5m : modelPricing.cacheWrite;
					const pCacheWrite1h = modelPricing.cacheWrite1h !== undefined ? modelPricing.cacheWrite1h : (Number(modelPricing.input) || 0) * 2;
					cost = ((billableInput * pInput) + (outTokens * pOutput) + (cacheReadTokens * pCacheRead) + (cacheWrite5mTokens * pCacheWrite5m) + (cacheWrite1hTokens * pCacheWrite1h)) / 1000000;
				}
			const cacheWriteBreakdownKnown = !hasClaudeUsage || cacheWriteTokens === 0 || (cacheWrite5mTokens + cacheWrite1hTokens >= cacheWriteTokens);
			const savePromise = AnalyticsStorage.record(modelId, modelName, inTokens, outTokens, cacheReadTokens, cost, null, cacheWriteTokens, {
				source: 'provider-usage', estimated: false, usageKey: dedupeKey,
				cacheKnown: true, costKnown: pricingUsable && cacheWriteBreakdownKnown && unclassifiedTokens === 0 && !totalComponentMismatch,
				cacheWrite5mTokens, cacheWrite1hTokens, sessionGeneration: usageGeneration
			});
			// 落库失败时释放去重键；否则后续同一响应即使重试成功，也会
			// 被误认为已经计量，形成不可恢复的漏算。

				if (savePromise && typeof savePromise.then === 'function') {
					this.networkUsagePendingSaves.add(savePromise);
					savePromise.then(saved => {
						this.networkUsagePendingSaves.delete(savePromise);
						if (this.sessionGeneration !== usageGeneration) return;
						if (saved === null) {
							this.networkUsageKeys.delete(dedupeKey);
						} else {
							registerSavedOutputTexts();
							this.networkUsageSavedAt = Math.max(this.networkUsageSavedAt, observedAt);
						}
					}).catch(() => {
						this.networkUsagePendingSaves.delete(savePromise);
						if (this.sessionGeneration !== usageGeneration) return;
						this.networkUsageKeys.delete(dedupeKey);
					});
				} else {
					registerSavedOutputTexts();
					this.networkUsageSavedAt = observedAt;
				}
		},

		hasNetworkOutputForText(text) {
			const normalized = String(text || '').replace(/\s+/g, ' ').trim();
			if (!normalized) return false;
			return this.networkOutputTexts.some(output => {
				if (!output) return false;
				// 短回答只有在完全相等时才视为同一响应，避免
				// “OK/好”等短文本误匹配其它响应；长文本才允许包含关系。
				if (output === normalized) return true;
				if (normalized.length < 12 || output.length < 12) return false;
				return output.includes(normalized) || normalized.includes(output);
			});
		},

		scheduleScan(delay = 400) {
			if (this.debounceTimer) clearTimeout(this.debounceTimer);
			this.debounceTimer = setTimeout(() => {
				this.debounceTimer = null;
				this.scanConversationTurns().catch(error => {
					console.warn('[AB Analytics] 自动扫描失败:', error);
				});
			}, Math.max(0, Number(delay) || 0));
		},

		observeDOM() {
			if (this.isObserving) return;
			this.isObserving = true;
			const obs = new MutationObserver((mutations) => {
				const panel = this.panelNode && document.body.contains(this.panelNode)
					? this.panelNode
					: document.querySelector('.antigravity-agent-side-panel');
				// The panel observer below owns conversation mutations. The body
				// observer only needs to notice panel mount/replacement, avoiding a
				// second scan for every streamed token and tool DOM update.
				const outsidePanelChanged = mutations.some(mutation => !panel || !panel.contains(mutation.target));
				if (outsidePanelChanged) this.scheduleScan(800);
			});
			this.domObserver = obs;
			obs.observe(document.body, { childList: true, subtree: true });
		},

		observePanel(panelEl) {
			if (!panelEl) return;
			this.detectActiveModel(panelEl);
			if (this.panelNode === panelEl && this.panelObs) {
				this.scheduleScan(250);
				return;
			}
			// 初次挂载也等待最后一轮完成；否则“只有用户文本”的
			// 正在生成轮次会先入账，回答出现后又以新签名重复入账。
			this.panelNode = panelEl;
			this.scheduleScan(250);
			if (this.panelObs) this.panelObs.disconnect();
			this.panelObs = new MutationObserver(() => {
				this.scheduleScan(400);
			});
			this.panelObs.observe(panelEl, { childList: true, subtree: true });
		},

		async scanConversationTurns() {
			if (this.scanInFlight) {
				return new Promise(resolve => {
					this.scanQueuedWaiters.push(resolve);
				});
			}
			const scanPromise = this._scanConversationTurns();
			this.scanInFlight = scanPromise;
			try {
				return await scanPromise;
			} finally {
				if (this.scanInFlight === scanPromise) this.scanInFlight = null;
				if (this.scanQueuedWaiters.length) {
					const waiters = this.scanQueuedWaiters.splice(0);
					this.scanConversationTurns().then(result => {
						waiters.forEach(resolve => resolve(result));
					}).catch(error => {
						console.error('[AB Analytics] 排队扫描失败:', error);
						waiters.forEach(resolve => resolve(undefined));
					});
				}
			}
		},

		async _scanConversationTurns() {
			const panel = document.querySelector('.antigravity-agent-side-panel') || document.body;
			if (!panel) return;
			if (Date.now() < this.sessionScanBlockedUntil) return;
			this.detectActiveModel(panel);

			// 精准定位 Antigravity 对话滚动视口与消息流容器
			const chatScroller = panel.querySelector('#conversation [aria-label="Message history"], #conversation .overflow-y-auto, [aria-label="Message history"]') || panel;
			const sessionRoot = panel.querySelector('#conversation') || chatScroller;
			if (this.sessionRootNode && this.sessionRootNode !== sessionRoot) {
				this.resetSessionTracking(350);
				return;
			}

			// 是否正在流式生成中（取消/停止按钮存在）
			const isGenerating = !!panel.querySelector('[data-tooltip-id="input-send-button-cancel-tooltip"]');

			// 直接从 Antigravity 官方消息树中提取纯正的用户提问与AI回答节点
			const userArticles = Array.from(chatScroller.querySelectorAll('[role="article"][aria-label="User message"], [aria-label="User message"], .bg-gray-500\\/15, [class*="bg-gray-500/15"], .bg-gray-500\\/20'));

			const validTurns = [];
			if (userArticles.length > 0) {
				userArticles.forEach((uEl, idx) => {
					const turnNode = uEl.closest('.flex.items-start') || uEl.closest('[class*="items-start"]') || uEl.parentElement?.parentElement || uEl;
					const aiEl = turnNode.querySelector('[role="article"][aria-label="Agent response"], [aria-label="Agent response"], [data-quotable="true"], .leading-relaxed.select-text:not(.opacity-70)');
					const thinkEl = turnNode.querySelector('.opacity-70.leading-relaxed, [class*="opacity-70"][class*="leading-relaxed"]');
					validTurns.push({
						node: turnNode,
						userEl: uEl,
						thinkEl,
						aiEl,
						index: idx
					});
				});
			} else {
				const chatContainer = panel.querySelector('#conversation [class*="gap-y-3"], [class*="gap-y-3"]') || panel;
				const turns = chatContainer === panel ? Array.from(panel.children) : Array.from(chatContainer.children);
				for (let k = 0; k < turns.length; k++) {
					const turnNode = turns[k];
					if (!turnNode || !turnNode.querySelector) continue;
					const userEl = turnNode.querySelector('.bg-gray-500\\/15, [class*="bg-gray-500/15"], .bg-gray-500\\/20');
					const thinkEl = turnNode.querySelector('.opacity-70.leading-relaxed, [class*="opacity-70"][class*="leading-relaxed"]');
					const aiEl = turnNode.querySelector('.leading-relaxed.select-text:not(.opacity-70), [class*="leading-relaxed"][class*="select-text"]:not([class*="opacity-70"])');
					if (!aiEl && !userEl) continue;
					validTurns.push({ node: turnNode, userEl, thinkEl, aiEl, index: k });
				}
			}
			if (validTurns.length > 0) {
					const fp = this.getSessionFingerprint(panel, sessionRoot, validTurns);
					if (!this.currentSessionFingerprint && fp) this.currentSessionFingerprint = fp;
				}

			// 逐轮计算并入库
			let activeContextTokens = 0;
			for (let vIdx = 0; vIdx < validTurns.length; vIdx++) {
				// 会话切换/聊天根节点替换可能发生在上一轮的异步
				// IndexedDB 写入期间；旧扫描不能把剩余 DOM 当成新会话继续处理。
				if (scanGeneration !== this.sessionGeneration) return;
				const turn = validTurns[vIdx];
				const isLastTurn = vIdx === validTurns.length - 1;

				// 最后一轮正在生成时无论是否强制补扫都等待完成；强制补扫
				// 若把半成品先写入，回答完成后签名变化会再次写入全量。
				if (isLastTurn && isGenerating) {
					continue;
				}

				const uText = turn.userEl ? (turn.userEl.textContent || '').trim() : '';
				const thText = turn.thinkEl ? (turn.thinkEl.textContent || '').trim() : '';
				const aiText = turn.aiEl ? (turn.aiEl.textContent || '').trim() : '';
				// 最后一轮只有用户文本而没有回答/思考时，先等待生成完成。
				// 强制补扫也不能把半成品先记账，否则回答出现后会按新签名
				// 再记完整轮次，造成输入重复计费。
				if (isLastTurn && !aiText && !thText) continue;

				const contentRoots = [turn.userEl, turn.thinkEl, turn.aiEl].filter(Boolean);

				const actionEls = rawActionEls.filter(el => !rawActionEls.some(parent => parent !== el && parent.contains(el)));

				const toolTokens = this.estimateTokens(toolText);

				const compTokens = this.estimateTokens(aiText);

				// 物理在席累积上下文与 72% 前缀缓存算法 (与 scan_history_conversations.py 100% 同构对齐)
				const inTokens = Math.max(turnRawIn, activeContextTokens + turnRawIn);
				let cacheTokens = 0;
				if (activeContextTokens >= 2000) {
					cacheTokens = Math.min(activeContextTokens, Math.floor(inTokens * 0.72));

				// 签名会随回答/工具输出增量而变化，不能把“签名相同”当作
				// 唯一的差量基线；否则同一轮一旦追加文本就会整轮重算。
				// 同时保留节点签名校验，防止 React 虚拟列表复用节点时串用旧值。
				const nodeIdentity = keyNode.dataset.abTrackedIdentity || '';
				const sameNodeTurn = keyNode.dataset.abTrackedSignature === sig && (!nodeIdentity || nodeIdentity === turnIdentity);
				const priorState = this.trackedTurnStates.get(turnIdentity);
				const nodeState = sameNodeTurn ? {
					inTokens: parseInt(keyNode.dataset.abInTokens || '0', 10),
					outTokens: parseInt(keyNode.dataset.abOutTokens || '0', 10),
					cacheTokens: parseInt(keyNode.dataset.abCacheTokens || '0', 10)

				const baseline = priorState || nodeState;
				const prevIn = baseline ? Math.max(0, Number(baseline.inTokens) || 0) : 0;

					if (signatureAlreadyTracked || hasNoNewTokens) {

					// 只把同一响应的输出指纹，或刚完成的最后一轮，视为网络已覆盖。

						(isLastTurn && this.networkUsageSeen && this.networkUsageSavedAt === this.networkUsageSeenAt &&
							(Date.now() - this.networkUsageSavedAt) < 5000);
					if (!networkLikelyCovered) {

						const mPricing = PricingManager.resolve(resolvedModel);
						const pricingUsable = !!mPricing;
						const is200k = inTokens > 200000;
						const pInput = pricingUsable ? (is200k && mPricing.input_200k !== undefined ? mPricing.input_200k : mPricing.input) : 0;
						const pOutput = pricingUsable ? (is200k && mPricing.output_200k !== undefined ? mPricing.output_200k : mPricing.output) : 0;
						const pCache = pricingUsable ? (is200k && mPricing.cache_200k !== undefined ? mPricing.cache_200k : mPricing.cacheRead) : 0;
						const recNetIn = Math.max(0, recIn - recCache);
						const cost = pricingUsable ? (recNetIn * pInput + recOut * pOutput + recCache * pCache) / 1_000_000.0 : null;
						// inTokens 已经包含完整物理输入（含缓存），增量总输入即为 recIn
						const totalInTokens = recIn;
						this.pendingTurnStates.add(turnIdentity);
						let saved = null;
						try {
							saved = await AnalyticsStorage.record(mPricing ? mPricing.id : 'unknown', mPricing ? mPricing.name : (this.currentModelStr || t('unknown_model')), totalInTokens, recOut, recCache, cost, null, 0, {
								source: 'dom-estimate', estimated: true, turnKey: sig,
								cacheKnown: true, costKnown: pricingUsable, sessionGeneration: scanGeneration
							});
						} catch (e) {}

									if (scanGeneration !== this.sessionGeneration) return;
									if (saved === null) continue;
						console.log(`[AB Analytics] 离线补扫入库 (DOM 级): 总输入(含缓存): ${totalInTokens}, 输出: ${recOut}, 缓存: ${recCache}`);
					} else {
						// 网络 usage 已覆盖同一响应时，仅作 UI 状态追踪，避免重复加账。
						console.log(`[AB Analytics] 标记已追踪 (跳过重复写入): 输入: ${recIn}, 输出: ${recOut}, 缓存: ${recCache}`);
					}

				}

				// 保存当前完整可见量作为下一次增量基线，而不是用
				// “旧基线 + 本次增量”推导；当 UI 替换/缩短正文时不会
				// 把已经消失的旧文本继续带入下一轮。
				this.trackedTurnStates.set(turnIdentity, { inTokens, outTokens, cacheTokens, signature: sig });
				this.processedHashes.add(sig);
				this.saveHashes();

				keyNode.dataset.abTrackedId = '1';
				keyNode.dataset.abTrackedSignature = sig;
				keyNode.dataset.abTrackedIdentity = turnIdentity;
				keyNode.dataset.abInTokens = String(inTokens);
				keyNode.dataset.abOutTokens = String(outTokens);
				keyNode.dataset.abCacheTokens = String(cacheTokens);

				if (turn.aiEl) turn.aiEl.dataset.abTrackedId = '1';
				if (turn.userEl) turn.userEl.dataset.abTrackedId = '1';

			}
		}
	};

	// 挂载到 window 方便开发者调试与测试
        try {

// ===== 用户消息导航 (纯正用户提问提取 + 精准物理容器滚动) =====
const NAV_EXCLUDED_SELECTOR = '#ab-modal, #ab-overlay, #ab-analytics-modal, #ab-analytics-overlay, #ab-side-actions, #ab-toast, #ab-search-bar, [role="dialog"], textarea, input, button';

function navGetPanel() {
    return document.querySelector('.antigravity-agent-side-panel') || (typeof panelEl !== 'undefined' ? panelEl : null) || document.body;
}

function navFindChatScroller(panel) {
    const p = panel || navGetPanel();
    const candidates = [];
    if (p) {
        p.querySelectorAll('.overflow-y-auto, [class*="overflow-y-auto"]').forEach(n => {
            if (n.scrollHeight > n.clientHeight + 2) candidates.push(n);
        });
    }
    document.querySelectorAll('#conversation .overflow-y-auto, .antigravity-agent-side-panel .overflow-y-auto, .overflow-y-auto').forEach(n => {
        if (n.scrollHeight > n.clientHeight + 2 && !candidates.includes(n)) candidates.push(n);
    });
    if (candidates.length > 0) {
        candidates.sort((a, b) => b.scrollHeight - a.scrollHeight);
        return candidates[0];
    }
    return document.scrollingElement || document.documentElement || document.body;
}

// 向上追溯特定气泡的真正滚动容器
function navFindScrollerForBubble(bubble, panel) {
    let parent = bubble ? bubble.parentElement : null;
    while (parent && parent !== document.body && parent !== document.documentElement) {
        const style = window.getComputedStyle(parent);
        const oy = style.overflowY;
        if ((oy === 'auto' || oy === 'scroll') && parent.scrollHeight > parent.clientHeight + 5) {
            return parent;
        }
        parent = parent.parentElement;
    }
    return navFindChatScroller(panel);
}

// 提取纯正的用户提问气泡 (严谨匹配用户输入样式，剔除工具卡片与AI回答)
// 提取纯正的用户提问气泡 (严谨匹配用户输入样式，剔除工具卡片与AI回答)
function navGetUserBubbles(panel) {
    const p = panel || navGetPanel();
    if (!p) return [];

    const scroller = navFindChatScroller(p);
    const searchRoot = scroller || p;

    // 1. 首选 Antigravity 官方用户消息语义元素
    let raw = Array.from(searchRoot.querySelectorAll('[role="article"][aria-label="User message"], [aria-label="User message"]'));

    // 2. 备选样式特征抓取
    if (raw.length === 0) {
        raw = Array.from(searchRoot.querySelectorAll([
            '.bg-gray-500\\/15',
            '.bg-gray-500\\/20',
            '[class*="bg-gray-500/15"]',
            '[class*="bg-gray-500/20"]',
            '[data-message-author-role="user"]',
            '[data-role="user"]'
        ].join(', ')));
    }

    const valid = [];
    for (const el of raw) {
        if (!el || valid.includes(el)) continue;
        // 排除模态框、悬浮条
        if (el.closest(NAV_EXCLUDED_SELECTOR)) continue;
        // 排除纯代码块、终端输出、产物预览
        if (el.closest('pre, code, [class*="terminal"], [data-artifact-id]')) continue;
        // 排除具体的工具执行调用卡片
        if (el.closest('[class*="tool-call"], [class*="tool-execution"], [class*="tool-item"], [data-testid*="tool-call"], [data-testid*="tool-result"]')) continue;
        // 排除 AI 思考块与 AI 正文文本
        if (el.closest('.opacity-70.leading-relaxed')) continue;

        // 确保物理可见
        const style = window.getComputedStyle(el);
        if (style.display === 'none' || style.visibility === 'hidden' || style.opacity === '0') continue;
        const rect = el.getBoundingClientRect();
        if (rect.width <= 0 && rect.height <= 0) continue;

        const text = (el.textContent || '').trim();
        if (!text) continue;
        if (/^(worked for|<|\\$\\s|npm |git |python |running )/i.test(text) && !text.includes('\\n')) continue;

        // 避免父子嵌套重复
        if (valid.some(other => other.contains(el))) continue;
        valid.push(el);
    }

    // 严谨排序：按所属轮次真实容器在页面上的几何高度升序排序
    valid.sort((a, b) => {
        const aTurn = a.closest('.flex.items-start') || a.closest('[class*="items-start"]') || a;
        const bTurn = b.closest('.flex.items-start') || b.closest('[class*="items-start"]') || b;
        return aTurn.getBoundingClientRect().top - bTurn.getBoundingClientRect().top;
    });
    return valid;
}

function navHighlightUserMessage(target) {
    if (!target) return;
    const oldOutline = target.style.outline;
    const oldShadow = target.style.boxShadow;
    const oldTrans = target.style.transition;
    target.style.transition = 'outline 0.2s ease, box-shadow 0.2s ease';
    target.style.outline = '2px solid #38bdf8';
    target.style.outlineOffset = '3px';
    target.style.boxShadow = '0 0 0 4px rgba(56, 189, 248, 0.45), 0 0 20px rgba(56, 189, 248, 0.55)';
    setTimeout(() => {
        target.style.outline = oldOutline;
        target.style.outlineOffset = '';
        target.style.boxShadow = oldShadow;
        target.style.transition = oldTrans;
    }, 1500);
}

// 精准滚动：针对 sticky 用户卡片，定位其轮次真实容器进行物理位移，100% 可达
function navScrollBubbleToTop(bubble, scroller, topOffset = 15) {
    if (!bubble) return;
    const turnNode = bubble.closest('.flex.items-start') || bubble.closest('[class*="items-start"]') || bubble.parentElement || bubble;
    try {
        turnNode.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (e) {}

    const sc = scroller || navFindScrollerForBubble(bubble);
    if (sc) {
        const sRect = sc.getBoundingClientRect();
        const tRect = turnNode.getBoundingClientRect();
        const currentScrollTop = sc.scrollTop || 0;
        const diff = tRect.top - sRect.top - topOffset;
        const maxScroll = Math.max(0, sc.scrollHeight - sc.clientHeight);
        const targetScrollTop = Math.max(0, Math.min(maxScroll, currentScrollTop + diff));
        sc.scrollTo({ top: targetScrollTop, behavior: 'smooth' });
    }
    navHighlightUserMessage(bubble);
}

let navJumpBusy = false;

async function handleUserMessageJump(direction) {
    if (navJumpBusy || (direction !== -1 && direction !== 1)) return;
    const panel = navGetPanel();
    if (!panel) return;
    const scroller = navFindChatScroller(panel);
    if (!scroller) return;

    navJumpBusy = true;
    try {
        const bubbles = navGetUserBubbles(panel);
        if (bubbles.length === 0) {
            if (window._abShowToast) window._abShowToast(direction === 1 ? t('jump_already_bottom') : t('jump_already_top'));
            return;
        }

        const sRect = scroller.getBoundingClientRect();
        const maxScroll = Math.max(0, scroller.scrollHeight - scroller.clientHeight);

        if (direction === 1) {
            // ===== 下键：跳到下一条用户提问 =====
            const belowItems = bubbles.map(b => ({
                bubble: b,
                turn: b.closest('.flex.items-start') || b.closest('[class*="items-start"]') || b,
                top: (b.closest('.flex.items-start') || b.closest('[class*="items-start"]') || b).getBoundingClientRect().top
            })).filter(item => item.top > sRect.top + 40);

            if (belowItems.length > 0) {
                const target = belowItems[0];
                const targetIdx = bubbles.indexOf(target.bubble) + 1;
                navScrollBubbleToTop(target.bubble, scroller, 15);
                if (window._abShowToast) window._abShowToast(`${t('jump_next_success')} (${targetIdx}/${bubbles.length})`);
            } else {
                if (scroller.scrollTop < maxScroll - 15) {
                    scroller.scrollTo({ top: maxScroll, behavior: 'smooth' });
                    if (window._abShowToast) window._abShowToast(t('jump_to_bottom'));
                } else {
                    if (window._abShowToast) window._abShowToast(t('jump_already_bottom'));
                }
            }
        } else {
            // ===== 上键：跳到上一条用户提问 =====
            const aboveItems = bubbles.map(b => ({
                bubble: b,
                turn: b.closest('.flex.items-start') || b.closest('[class*="items-start"]') || b,
                top: (b.closest('.flex.items-start') || b.closest('[class*="items-start"]') || b).getBoundingClientRect().top
            })).filter(item => item.top < sRect.top - 15);

            if (aboveItems.length > 0) {
                const target = aboveItems[aboveItems.length - 1];
                const targetIdx = bubbles.indexOf(target.bubble) + 1;
                navScrollBubbleToTop(target.bubble, scroller, 15);
                if (window._abShowToast) window._abShowToast(`${t('jump_prev_success')} (${targetIdx}/${bubbles.length})`);
            } else {
                // 上方没有更多可见气泡：检查首个气泡
                const first = bubbles[0];
                const firstTop = first ? (first.closest('.flex.items-start') || first).getBoundingClientRect().top : 0;
                if (first && firstTop > sRect.top + 30) {
                    navScrollBubbleToTop(first, scroller, 15);
                    if (window._abShowToast) window._abShowToast(`${t('jump_aligned_top')} (1/${bubbles.length})`);
                } else {
                    // 检查是否有虚拟列表的'加载更早历史提问'按钮
                    const loadOlderBtn = scroller.querySelector('button[aria-label*="Load older messages"]');
                    if (loadOlderBtn && loadOlderBtn.getAttribute('aria-disabled') !== 'true') {

                    } else {

                    }
                }
            }
        }
    } catch (err) {
        console.warn('[AB Navigation] 跳转处理异常:', err);

    }
}

// 净化输入框工具栏文件图标四周的折角标注 (包含蓝色、灰色与任意颜色状态)
function cleanContextCornerMarks() {
    try {
        const panel = document.querySelector('.antigravity-agent-side-panel') || document.body;
        if (!panel) return;
        const svgs = panel.querySelectorAll('form svg, [class*="input"] svg, [class*="prompt"] svg, textarea ~ * svg, [class*="bottom"] svg, [class*="flex"] > button svg, [class*="toolbar"] svg');
        svgs.forEach(svg => {
            const elements = Array.from(svg.querySelectorAll('path, rect, polygon, line'));
            elements.forEach(el => {
                const d = el.getAttribute('d') || '';
                const stroke = (el.getAttribute('stroke') || el.style.stroke || '').toLowerCase();
                const fill = (el.getAttribute('fill') || el.style.fill || '').toLowerCase();
                const cls = (el.getAttribute('class') || '').toLowerCase();

                const hasCornerCoord = /M\s*3[\s,]+[57]|M\s*17[\s,]+3|M\s*3[\s,]+17|M\s*21[\s,]+17/i.test(d) ||
                                       /M3\s*7|M17\s*3|M3\s*17|M21\s*17/i.test(d);

                const isBlue = stroke.includes('0078d4') || stroke.includes('38bdf8') || stroke.includes('0, 120, 212') || stroke.includes('0,120,212') || stroke.includes('blue') ||
                               fill.includes('0078d4') || fill.includes('38bdf8') || fill.includes('0, 120, 212') || fill.includes('0,120,212') || fill.includes('blue') ||
                               cls.includes('blue');
                if (isBlue && hasCornerCoord) {
                    el.style.setProperty('display', 'none', 'important');
                    el.style.setProperty('stroke', 'transparent', 'important');
                    el.style.setProperty('fill', 'transparent', 'important');
                    return;
                }
                if (hasCornerCoord) {
                    const mCount = (d.match(/M/gi) || []).length;
                    if (mCount <= 4 && !/H18|H19|H20|V18|V20|v16|h12/i.test(d)) {
                        el.style.setProperty('display', 'none', 'important');
                        return;
                    }
                    const segments = d.split(/(?=M)/i);
                    const cleanSegments = segments.filter(seg => !/M\s*(3[\s,]+[57]|17[\s,]+3|3[\s,]+17|21[\s,]+17)/i.test(seg));
                    if (cleanSegments.length > 0 && cleanSegments.length < segments.length) {
                        el.setAttribute('d', cleanSegments.join(''));
                    }
                }
            });
        });
    } catch (e) {}
}
if (window._abCornerCleanupTimer) clearInterval(window._abCornerCleanupTimer); window._abCornerCleanupTimer = setInterval(cleanContextCornerMarks, 1200);

let searchMatches = [];
let activeMatchIdx = -1;

function clearSearchHighlights() {
searchMatches = [];
activeMatchIdx = -1;
if (searchCounter) searchCounter.textContent = '0/0';
const highlighted = document.querySelectorAll('mark.ab-search-highlight');
highlighted.forEach(m => {
const parent = m.parentNode;
if (parent) {
parent.replaceChild(document.createTextNode(m.textContent), m);
parent.normalize();
}
});
}

function performSearch(query) {
clearSearchHighlights();
const q = (query || '').trim();
if (!q) return;

const searchRoot = document.querySelector('.antigravity-agent-side-panel') || panelEl || document.body;
const walker = document.createTreeWalker(
searchRoot,
NodeFilter.SHOW_TEXT,
{
acceptNode(node) {
if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
const parent = node.parentElement;
if (!parent) return NodeFilter.FILTER_REJECT;
const tag = parent.tagName.toLowerCase();
if (tag === 'script' || tag === 'style' || tag === 'textarea' || tag === 'input') return NodeFilter.FILTER_REJECT;
if (parent.closest('#ab-overlay') || parent.closest('#ab-analytics-overlay') || parent.closest('#ab-search-bar') || parent.closest('#ab-side-actions') || parent.closest('#ab-toast')) {
return NodeFilter.FILTER_REJECT;
}
return NodeFilter.FILTER_ACCEPT;
}
}
);

const nodesToReplace = [];
let currentNode;
while ((currentNode = walker.nextNode())) {
if (currentNode.nodeValue.toLowerCase().includes(q.toLowerCase())) {
nodesToReplace.push(currentNode);
}
}

const marks = [];
for (const textNode of nodesToReplace) {
const parent = textNode.parentNode;
if (!parent) continue;
const text = textNode.nodeValue;
const lowerText = text.toLowerCase();
const lowerQ = q.toLowerCase();
let startIndex = 0;
let matchIndex;

const frag = document.createDocumentFragment();
while ((matchIndex = lowerText.indexOf(lowerQ, startIndex)) !== -1) {
if (matchIndex > startIndex) {
frag.appendChild(document.createTextNode(text.substring(startIndex, matchIndex)));
}
const mark = document.createElement('mark');
mark.className = 'ab-search-highlight';
mark.style.cssText = 'background:#fef08a; color:#18181b; border-radius:2px; padding:0 2px; font-weight:600; box-shadow:0 0 4px rgba(250,204,21,0.5);';
mark.textContent = text.substring(matchIndex, matchIndex + q.length);
frag.appendChild(mark);
marks.push(mark);
startIndex = matchIndex + q.length;
}
if (startIndex < text.length) {
frag.appendChild(document.createTextNode(text.substring(startIndex)));
}
parent.replaceChild(frag, textNode);
}

searchMatches = marks;
if (searchMatches.length > 0) {
activeMatchIdx = 0;
updateMatchVisual();
} else {
activeMatchIdx = -1;
if (searchCounter) searchCounter.textContent = '0/0';
}
}

function updateMatchVisual() {
searchMatches.forEach((m, idx) => {
if (idx === activeMatchIdx) {
m.classList.add('ab-search-active');
m.style.background = '#f59e0b';
m.style.color = '#000000';
m.style.outline = '2px solid #38bdf8';
m.style.boxShadow = '0 0 10px #f59e0b';
} else {
m.classList.remove('ab-search-active');
m.style.background = '#fef08a';
m.style.color = '#18181b';
m.style.outline = 'none';
m.style.boxShadow = '0 0 4px rgba(250,204,21,0.5)';
}
});
if (searchCounter) {
searchCounter.textContent = searchMatches.length > 0
? (activeMatchIdx + 1) + '/' + searchMatches.length
: '0/0';
}
if (activeMatchIdx >= 0 && searchMatches[activeMatchIdx]) {
searchMatches[activeMatchIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
}
}

function nextMatch() {
if (searchMatches.length === 0) return;
activeMatchIdx = (activeMatchIdx + 1) % searchMatches.length;
updateMatchVisual();
}

function prevMatch() {
if (searchMatches.length === 0) return;
activeMatchIdx = (activeMatchIdx - 1 + searchMatches.length) % searchMatches.length;
updateMatchVisual();
}

const totalCostValue = totalCostKnown ? ('$' + tCost.toFixed(tCost >= 1 ? 2 : 4)) : (tCost > 0 ? ('$' + tCost.toFixed(tCost >= 1 ? 2 : 4) + '*') : unknownValue);
const todayCostValue = todayCostKnown ? ('$' + dCost.toFixed(dCost >= 1 ? 2 : 4)) : (dCost > 0 ? ('$' + dCost.toFixed(dCost >= 1 ? 2 : 4) + '*') : unknownValue);

	let katexLoaded = false, katexLoadPromise = null, latexObserver = null;

	function loadKaTeX() {
		if (katexLoaded) return Promise.resolve();
		if (katexLoadPromise) return katexLoadPromise;
		katexLoadPromise = new Promise((resolve, reject) => {
			Promise.all([
				fetch(KATEX_CSS).then(r => r.text()),
				fetch(KATEX_JS).then(r => r.text())
			]).then(async ([css, js]) => {
				if (window.crypto && window.crypto.subtle) {
					try {
						const buf = new TextEncoder().encode(js);
						const hashBuf = await window.crypto.subtle.digest('SHA-256', buf);
						const hashArr = Array.from(new Uint8Array(hashBuf));
						const hashHex = hashArr.map(b => b.toString(16).padStart(2, '0')).join('');
						if (hashHex.toLowerCase() !== KATEX_JS_SHA256.toLowerCase()) {
							throw new Error('KaTeX script integrity check failed: hash mismatch');
						}
					} catch (err) {
						katexLoadPromise = null;
						reject(err);
						return;
					}
				}

				const style = document.createElement('style'); style.textContent = css; document.head.appendChild(style);
				const wrappedJs = '(function(module, exports, define) {\n' + js + '\n}).call(window, undefined, undefined, undefined);';
				const blob = new Blob([wrappedJs], { type: 'application/javascript' });
				const blobUrl = URL.createObjectURL(blob);
				const script = document.createElement('script');
				script.src = abPolicy ? abPolicy.createScriptURL(blobUrl) : blobUrl;
				script.onload = () => {
					URL.revokeObjectURL(blobUrl); katexLoaded = true;
					console.log('[AB] ✅ KaTeX 加载成功 (SHA-256 完整性已验证), window.katex:', !!window.katex);
					resolve();
				};
				script.onerror = () => {
					URL.revokeObjectURL(blobUrl);
					katexLoadPromise = null;
					reject(new Error('KaTeX blob load failed'));
				};
				document.head.appendChild(script);

		if (!strikeEls.length) return;
		strikeEls.forEach(del => {
			if (del.closest && del.closest('pre, code, .latex-rendered, [contenteditable="true"]')) return;

			let prevText = '';
			let node = del.previousSibling;
			while (node) {
				if (node.nodeType === Node.TEXT_NODE) {
					if (node.textContent.trim()) {

						break;
					}
				} else if (node.nodeType === Node.ELEMENT_NODE) {
					prevText = node.textContent;
					break;
				}
				node = node.previousSibling;
			}

			let nextText = '';
			node = del.nextSibling;
			while (node) {
				if (node.nodeType === Node.TEXT_NODE) {
					if (node.textContent.trim()) {
						nextText = node.textContent;
						break;
					}
				} else if (node.nodeType === Node.ELEMENT_NODE) {
					nextText = node.textContent;
					break;
				}

			const delText = del.textContent || '';
			// 模式 1: 跨区间误伤 (如 30<del>50%...60</del>80%)
			const isRangeCrossing = /(?:\d+|[a-zA-Z])\s*~?\s*$/.test(prevText) &&
									/^\s*~?\s*(?:\d+|%|[a-zA-Z])/.test(delText) &&
									/(?:\d+|[a-zA-Z])\s*~?\s*$/.test(delText) &&
									/^\s*~?\s*(?:\d+|%|[a-zA-Z])/.test(nextText);

			// 模式 2: 单区间误伤 (如 30<del>50%</del> 或 30<del>~50%</del>)
			const isSingleRange = /(?:\d+|[a-zA-Z])\s*~?\s*$/.test(prevText) &&
								  /^\s*~?\s*(?:\d+|%)/.test(delText);

			if (isRangeCrossing) {
				const tn = document.createTextNode('～' + delText.replace(/^~+|~+$/g, '') + '～');

			} else if (isSingleRange) {

						openParens += (c.match(/\\\(/g) || []).length;
						closeParens += (c.match(/\\\)/g) || []).length;

				if (doubleDollars % 2 === 1 || singleDollars % 2 === 1 || openBrackets > closeBrackets || openParens > closeParens) {
					const tag = fmt.tagName;
					const isUnder = tag === 'EM' || tag === 'I';
					const isStrike = tag === 'DEL' || tag === 'S' || tag === 'STRIKE';
					const prevText = fmt.previousSibling ? (fmt.previousSibling.textContent || '') : '';
					const nextText = fmt.nextSibling ? (fmt.nextSibling.textContent || '') : '';

					changed = true;
				}

	}

	function sanitizeLatexFormula(formula) {
		if (!formula) return "";
		let f = formula.trim();

		// 0. 解码常见的 Markdown/HTML 实体 (防止 &gt; &lt; &quot; &#39; &nbsp; 导致 KaTeX 语法解析失败)
		f = f.replace(/&lt;/g, "<")
		     .replace(/&gt;/g, ">")
		     .replace(/&quot;/g, "\"")
		     .replace(/&#39;/g, "'")
		     .replace(/&nbsp;/g, " ");

		// 智能处理 & 与 &amp;: 对齐环境(aligned/cases/matrix/array等)中转为 &，环境之外转为 \& (避免 KaTeX Expected EOF 报错)
		const alignEnvPattern = /\\begin\{(?:matrix|pmatrix|bmatrix|vmatrix|aligned|cases|array|split|gather|multline)\}[\s\S]*?\\end\{(?:matrix|pmatrix|bmatrix|vmatrix|aligned|cases|array|split|gather|multline)\}/g;
		let lastIdx = 0, envMatch;
		let processed = "";
		while ((envMatch = alignEnvPattern.exec(f)) !== null) {
			const outside = f.slice(lastIdx, envMatch.index);
			processed += outside.replace(/&amp;/g, "\\&").replace(/(?<!\\)&/g, "\\&");
			processed += envMatch[0].replace(/&amp;/g, "&");
			lastIdx = envMatch.index + envMatch[0].length;
		}
		processed += f.slice(lastIdx).replace(/&amp;/g, "\\&").replace(/(?<!\\)&/g, "\\&");
		f = processed;

		// 1. 修复 AI 常见的语法错误：大括号缺失或宏后缺空格
		f = f.replace(/\\left\s*\{/g, "\\left\\{");
		f = f.replace(/\\right\s*\}/g, "\\right\\}");
		f = f.replace(/\\textsc([A-Za-z]+)/g, "\\textsc{$1}");

		// 2. 修复意外的列表符号负号断裂
		f = f.replace(/^[•\-\*]\s+/gm, "- ");

		// 3. 修复矩阵与对齐环境内部因 Markdown 吞噬换行 \\ 导致的行塌陷 (保护并修复 \\[...pt] 间距语法)
		f = f.replace(/(\\begin\{(?:matrix|pmatrix|bmatrix|vmatrix|aligned|cases|array|split|gather|multline)\}[\s\S]*?\\end\{(?:matrix|pmatrix|bmatrix|vmatrix|aligned|cases|array|split|gather|multline)\})/g, (m) => {
			return m.split("\n").map((line, idx, arr) => {
				const trimmed = line.trim();
				if (!trimmed || idx === 0 || idx === arr.length - 1 || trimmed.startsWith("\\end{")) return line;
				// 处理 Markdown 吞掉一个反斜杠的行间距语法: \[12pt] -> \\[12pt]
				if (/(?<!\\)\\\s*(\[\s*\d+\s*(?:pt|em|ex|px)?\s*\])\s*$/.test(trimmed)) {
					return line.replace(/(?<!\\)\\\s*(\[\s*\d+\s*(?:pt|em|ex|px)?\s*\])\s*$/, "\\\\$1");
				}
				// 如果行尾已有 \\ 或 \\[...pt]，不重复添加
				if (/\\\\(?:\s*\[[^\]]*\])?\s*$/.test(trimmed)) return line;
				// 如果行尾只有一个反斜杠（被 markdown 吞了一个），补全为两个 \\
				if (/(?<!\\)\\\s*$/.test(trimmed)) {
					return line.replace(/(?<!\\)\\\s*$/, "\\\\");
				}
				const nextTrimmed = (arr[idx + 1] || "").trim();
				if (nextTrimmed.startsWith("\\end{")) return line;
				return line + " \\\\";
			}).join("\n");
		});
		return f;
	}
	function processLatexInElement(elem) {
		// v0.2.2-patch: 先修复被 markdown 破坏的 LaTeX 公式
		normalizeLatexInElement(elem);
		const text = elem.textContent;
		LATEX_PATTERN.lastIndex = 0;
		if (!LATEX_PATTERN.test(text)) return false; LATEX_PATTERN.lastIndex = 0;
		// 对于包含 $$ 或 \[...\] 的块级公式段落，整段替换
		const blockPattern = /^\s*(?:\$\$((?:(?!\$\$)[\s\S])+?)\$\$|\\\[((?:(?!\\\])[\s\S])+?)\\\])\s*$/;
		const blockMatch = text.match(blockPattern);

				let formula = sanitizeLatexFormula(blockMatch[1] || blockMatch[2]);

		// v0.2.2-patch: 将包含纯 LaTeX 的 <code> 元素解包，并记录原标签以支持 revertLatex 完美还原
		elem.querySelectorAll('code').forEach(code => {
			if (code.closest('pre')) return; // 不处理 <pre> 内的 <code>
			const ct = code.textContent;
			LATEX_PATTERN.lastIndex = 0;

				const full = m[0];
				const isBlock = full.startsWith('$$') || full.startsWith('\\[');
				let formula;
				if (full.startsWith('$$')) formula = full.slice(2, -2).trim();
				else if (full.startsWith('\\[')) formula = full.slice(2, -2).trim();

			}

		}

	}
	// 渲染 latex 代码块（语言标记为 "latex" 的 <pre> 元素）
	function processLatexCodeBlocks(scope) {
		// V0.2 代码块结构: <pre> > div.relative... > div(标题含语言名) + div.p-3(代码内容)
		scope.querySelectorAll('pre').forEach(pre => {
			if (pre.dataset.latexCodeProcessed) return;
			const codeContainer = pre.querySelector('div');
			if (!codeContainer) return;
			// 查找语言标签 (兼容多种类名及元素)
			let langLabel = codeContainer.querySelector('.font-sans.text-sm');
			if (!langLabel || langLabel.textContent.trim().toLowerCase() !== 'latex') {
				const candidate = Array.from(codeContainer.querySelectorAll('span, div')).find(e => e.children.length === 0 && e.textContent.trim().toLowerCase() === 'latex');
				if (candidate) langLabel = candidate;
			}
			if (!langLabel || langLabel.textContent.trim().toLowerCase() !== 'latex') return;
			// 获取代码内容（仅从 .line-content 提取，避免包含 <style> 标签文本）
			const codeBody = codeContainer.querySelector('.p-3');

			let formula = lineContents.length > 0
				? Array.from(lineContents).map(l => l.textContent).join('\n').trim()

			if (!formula) return;

				formula = sanitizeLatexFormula(formula);
				const rendered = document.createElement('div');
				rendered.className = 'latex-code-rendered latex-rendered';
				rendered.dataset.latexOriginal = formula;
				window.katex.render(formula, rendered, { throwOnError: false, displayMode: true, output: 'html', trust: false });

				codeBody.dataset.latexCodeOriginalDisplay = codeBody.style.display || '';
				codeBody.style.display = 'none';
				codeBody.parentNode.insertBefore(rendered, codeBody.nextSibling);
				pre.dataset.latexCodeProcessed = 'true';
			} catch (e) { /* ignore render errors */ }
		});
	}

	function fixSplitLatexBlocks(prose) {
		const children = Array.from(prose.children);
		let i = 0;
		while (i < children.length) {
			const el = children[i];
			if (el.tagName === 'P' || el.tagName === 'LI') {
				let txt = el.textContent;
				let open$ = (txt.match(/\$\$/g) || []).length;
				let openBracket = (txt.match(/\\\[/g) || []).length;
				let closeBracket = (txt.match(/\\\]/g) || []).length;

				if (open$ % 2 !== 0 || openBracket > closeBracket) {
					let j = i + 1;
					let mergedHtml = el.innerHTML;
					let found = false;
					let toRemove = [];
					while (j < children.length) {
						const nextEl = children[j];
						if (['P', 'UL', 'OL', 'LI', 'BLOCKQUOTE'].includes(nextEl.tagName)) {
							mergedHtml += '\n\n' + nextEl.innerHTML;
							toRemove.push(nextEl);

							let nextTxt = nextEl.textContent;
							let n$ = (nextTxt.match(/\$\$/g) || []).length;
							let nOpen = (nextTxt.match(/\\\[/g) || []).length;
							let nClose = (nextTxt.match(/\\\]/g) || []).length;

							open$ += n$;
							openBracket += nOpen;
							closeBracket += nClose;

							if (open$ % 2 === 0 && openBracket === closeBracket) {
								found = true;
								break;
							}
						} else {
							break;
						}
						j++;
					}
					if (found) {
						safeSetHTML(el, mergedHtml);
						toRemove.forEach(n => n.remove());
					}
				}
			}
			i++;
		}
	}


	function scanAndRenderLatex(panelEl) {
		const scope = panelEl || document.querySelector('.antigravity-agent-side-panel');
		if (!scope) return;
		try { fixAccidentalStrikethrough(scope); } catch (e) {}
		if (!currentSettings.latexEnabled || !katexLoaded) return;
		// 1. 处理正文中的内联/块级 LaTeX
		const proseSelectors = [
			'.leading-relaxed.select-text',
			'.select-text.leading-relaxed',
			'[class*="leading-relaxed"][class*="select-text"]',
			'.markdown-body',
			'[class*="markdown"]',
			'[class*="prose"]',
			'.whitespace-pre-wrap'
		];
		const proseSet = new Set();
		proseSelectors.forEach(sel => {
			try { scope.querySelectorAll(sel).forEach(e => proseSet.add(e)); } catch(e) {}
		});

				processLatexInElement(prose);
			}
			const elems = prose.querySelectorAll(elemSelector);

		});

			console.log('[AB] ⚠️ LaTeX: 未找到 prose 容器，尝试直接搜索 scope 内元素');
			scope.querySelectorAll(elemSelector).forEach(elem => {

				processLatexInElement(elem);
			});
		}
		// 2. 处理 latex 代码块
		processLatexCodeBlocks(scope);
	}
	function revertLatex(panelEl) {
		const scope = panelEl || document.querySelector('.antigravity-agent-side-panel');
		if (!scope) return;
		// 回退内联/块级公式
		scope.querySelectorAll('.latex-rendered:not(.latex-code-rendered)').forEach(e => {
			const orig = e.dataset.latexOriginal;
			if (!orig) return;
			const origTag = e.dataset.latexOriginalTag;
			if (origTag) {
				// 整段替换回原始元素
				const restored = document.createElement(origTag);
				restored.textContent = orig;
				e.parentNode.replaceChild(restored, e);
			} else {
				e.parentNode.replaceChild(document.createTextNode(orig), e);
			}
		});
		// 回退 latex 代码块
		scope.querySelectorAll('.latex-code-rendered').forEach(e => {
			const codeBody = e.previousElementSibling;
			if (codeBody && codeBody.dataset.latexCodeOriginalDisplay !== undefined) {
				codeBody.style.display = codeBody.dataset.latexCodeOriginalDisplay || '';
				delete codeBody.dataset.latexCodeOriginalDisplay;
			}
			e.remove();
		});
		scope.querySelectorAll('[data-latex-elem-processed]').forEach(e => delete e.dataset.latexElemProcessed);
		scope.querySelectorAll('[data-latex-code-processed]').forEach(e => delete e.dataset.latexCodeProcessed);
	}

	let mermaidLoaded = false, mermaidLoadPromise = null, mermaidObserver = null;
	const MERMAID_JS = 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js';
	const MERMAID_FALLBACK_JS = 'https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js';
	const MERMAID_JS_SHA256 = 'a43bc1afd446f9c4cc66ac5dd45d02e8d65e26fc5344ec0ef787f88d6ddb6f9e';
	let mermaidUidCounter = 0;

	function loadMermaid() {
		if (mermaidLoaded && window.mermaid) return Promise.resolve();
		if (mermaidLoadPromise) return mermaidLoadPromise;
		mermaidLoadPromise = new Promise((resolve, reject) => {
			const fetchScript = (url) => fetch(url).then(r => {
				if (!r.ok) throw new Error('HTTP ' + r.status);
				return r.text();
			});

			fetchScript(MERMAID_JS).catch(() => fetchScript(MERMAID_FALLBACK_JS)).then(async (js) => {
				if (window.crypto && window.crypto.subtle) {
					try {
						const buf = new TextEncoder().encode(js);
						const hashBuf = await window.crypto.subtle.digest('SHA-256', buf);
						const hashArr = Array.from(new Uint8Array(hashBuf));
						const hashHex = hashArr.map(b => b.toString(16).padStart(2, '0')).join('');
						if (hashHex.toLowerCase() !== MERMAID_JS_SHA256.toLowerCase()) {
							console.warn('[AB] Mermaid script SHA-256 mismatch, proceeding with caution');
						}
					} catch (err) {
						/* subtle crypto error */
					}
				}
				const blob = new Blob([js], { type: 'application/javascript' });
				const blobUrl = URL.createObjectURL(blob);
				const script = document.createElement('script');
				script.src = abPolicy ? abPolicy.createScriptURL(blobUrl) : blobUrl;
				script.onload = () => {
					URL.revokeObjectURL(blobUrl);
					try {
						const isLight = document.body.classList.contains('vscode-light');
						if (window.mermaid) {
							window.mermaid.initialize({
								startOnLoad: false,
								theme: isLight ? 'default' : 'dark',
								securityLevel: 'loose',
								fontFamily: 'inherit'
							});
						}
						mermaidLoaded = true;
						console.log('[AB] ✅ Mermaid 加载成功, window.mermaid:', !!window.mermaid);
						resolve();
					} catch (initErr) {
						console.warn('[AB] Mermaid initialize error:', initErr);
						resolve();
					}
				};
				script.onerror = () => {
					URL.revokeObjectURL(blobUrl);
					mermaidLoadPromise = null;
					reject(new Error('Mermaid blob script load failed'));
				};
				document.head.appendChild(script);
			}).catch(e => {
				mermaidLoadPromise = null;
				reject(new Error('Mermaid fetch failed: ' + e.message));
			});
		});
		return mermaidLoadPromise;
	}

			const codeBody = codeContainer.querySelector('.p-3');
			if (!codeBody) return;
			const lineContents = codeBody.querySelectorAll('.line-content');
			let code = lineContents.length > 0
				? Array.from(lineContents).map(l => l.textContent).join('\n').trim()
				: codeBody.textContent.trim();
			if (!code) return;

			pre.dataset.mermaidCodeProcessed = 'true';
			pre.dataset.mermaidCodeOriginal = code;

			const cleanCode = sanitizeMermaidCode(code);

			const rendered = document.createElement('div');
			rendered.className = 'mermaid-code-rendered';

			const headerEl = codeContainer.querySelector('div:first-child');
			let toggleGroup = null;
			let chartBtn = null, codeBtn = null;

			if (headerEl) {
				toggleGroup = document.createElement('div');
				toggleGroup.className = 'mermaid-header-btn-group';

				chartBtn = document.createElement('button');
				chartBtn.className = 'mermaid-tab-btn active';
				chartBtn.textContent = '📊 ' + t('btn_chart_view');
				chartBtn.title = t('btn_chart_view');

				codeBtn = document.createElement('button');
				codeBtn.className = 'mermaid-tab-btn';
				codeBtn.textContent = '💻 ' + t('btn_code_view');
				codeBtn.title = t('btn_code_view');

				chartBtn.addEventListener('click', (ev) => {
					ev.stopPropagation();
					chartBtn.classList.add('active');
					codeBtn.classList.remove('active');
					rendered.style.display = 'flex';
					codeBody.style.display = 'none';
				});

				codeBtn.addEventListener('click', (ev) => {
					ev.stopPropagation();
					codeBtn.classList.add('active');
					chartBtn.classList.remove('active');
					rendered.style.display = 'none';
					codeBody.style.display = codeBody.dataset.mermaidOriginalDisplay || '';
				});

				toggleGroup.appendChild(chartBtn);
				toggleGroup.appendChild(codeBtn);

				const actionContainer = headerEl.querySelector('.flex.items-center') || headerEl.lastElementChild;
				if (actionContainer && actionContainer !== headerEl) {
					headerEl.insertBefore(toggleGroup, actionContainer);
				} else {
					headerEl.appendChild(toggleGroup);
				}
			}

			codeBody.dataset.mermaidOriginalDisplay = codeBody.style.display || '';
			codeBody.style.display = 'none';
			codeBody.parentNode.insertBefore(rendered, codeBody.nextSibling);

			try {
				const diagId = 'mermaid-svg-' + (++mermaidUidCounter) + '-' + Math.floor(Math.random() * 10000);
				const isLight = document.body.classList.contains('vscode-light');
				window.mermaid.initialize({
					startOnLoad: false,
					theme: isLight ? 'default' : 'dark',
					securityLevel: 'loose',
					fontFamily: 'inherit'
				});

				const { svg } = await window.mermaid.render(diagId, cleanCode);

				const svgWrap = document.createElement('div');
				svgWrap.className = 'mermaid-svg-wrapper';
				safeSetHTML(svgWrap, svg);
				rendered.appendChild(svgWrap);

				const toolbar = document.createElement('div');
				toolbar.className = 'mermaid-toolbar';

				const copySvgBtn = document.createElement('button');
				copySvgBtn.className = 'mermaid-tab-btn';
				copySvgBtn.textContent = '📋 ' + t('btn_copy_svg');
				copySvgBtn.title = t('btn_copy_svg');
				copySvgBtn.addEventListener('click', async (ev) => {
					ev.stopPropagation();
					try {
						await navigator.clipboard.writeText(svg);
						const toastFn = window._abShowToast;
						if (toastFn) toastFn(t('toast_copy_svg_success'));
					} catch (err) {
						/* ignore */
					}
				});
				toolbar.appendChild(copySvgBtn);

				const zoomBtn = document.createElement('button');
				zoomBtn.className = 'mermaid-tab-btn';
				zoomBtn.textContent = '🔍 ' + t('btn_zoom_chart');
				zoomBtn.title = t('btn_zoom_chart');
				zoomBtn.addEventListener('click', (ev) => {
					ev.stopPropagation();
					openMermaidModal(svg);
				});
				toolbar.appendChild(zoomBtn);

				rendered.appendChild(toolbar);
			} catch (renderErr) {
				console.warn('[AB] Mermaid 渲染失败:', renderErr);
				const errDiv = document.createElement('div');
				errDiv.className = 'mermaid-error';
				errDiv.textContent = '⚠️ Mermaid: ' + (renderErr.message || String(renderErr));
				rendered.appendChild(errDiv);
				if (codeBtn) codeBtn.click();
			}
		});
	}

	function scanAndRenderMermaid(panelEl) {
		const scope = panelEl || document.querySelector('.antigravity-agent-side-panel');
		if (!scope) return;
		if (!currentSettings.mermaidEnabled || !mermaidLoaded) return;
		processMermaidCodeBlocks(scope);
	}

	function revertMermaid(panelEl) {
		const scope = panelEl || document.querySelector('.antigravity-agent-side-panel');
		if (!scope) return;
		scope.querySelectorAll('.mermaid-code-rendered').forEach(e => {
			const codeBody = e.previousElementSibling;
			if (codeBody && codeBody.dataset.mermaidOriginalDisplay !== undefined) {
				codeBody.style.display = codeBody.dataset.mermaidOriginalDisplay || '';
				delete codeBody.dataset.mermaidOriginalDisplay;
			}
			e.remove();
		});
		scope.querySelectorAll('.mermaid-header-btn-group').forEach(e => e.remove());
		scope.querySelectorAll('[data-mermaid-code-processed]').forEach(e => {
			delete e.dataset.mermaidCodeProcessed;
			delete e.dataset.mermaidCodeOriginal;
		});
		const modal = document.getElementById('ab-mermaid-modal');
		if (modal) modal.remove();
	}

	async function applyMermaidSettings(panelEl) {
		if (mermaidObserver) { mermaidObserver.disconnect(); mermaidObserver = null; }
		if (!currentSettings.mermaidEnabled) { revertMermaid(panelEl); return; }
		try {
			await loadMermaid();
			const scope = panelEl || document.querySelector('.antigravity-agent-side-panel');
			if (scope) {
				mermaidObserver = new MutationObserver(() => {
					clearTimeout(window._abMMTimer);
					window._abMMTimer = setTimeout(() => scanAndRenderMermaid(panelEl), 300);
				});
				mermaidObserver.observe(scope, { childList: true, subtree: true });
			}
			scanAndRenderMermaid(panelEl);
		} catch (e) { console.warn('[AB] Mermaid init failed:', e.message); }
	}
	// ===== 版本检测 =====
	const GITHUB_API = 'https://api.github.com/repos/016/Antigravity-Better/releases/latest';
	const FALLBACK_API = 'https://hub.lib00.com/api/v1/antigravity-better/version';
	function isNewerVersion(remote, local) {
		const r = remote.replace(/^v/i, '').split('.').map(Number);
		const l = local.replace(/^v/i, '').split('.').map(Number);
		for (let i = 0; i < Math.max(r.length, l.length); i++) { if ((r[i]||0) > (l[i]||0)) return true; if ((r[i]||0) < (l[i]||0)) return false; }
		return false;
	}
	async function checkForUpdate() {
		// 优先使用 GitHub API
		try {
			const resp = await fetch(GITHUB_API, { cache: 'no-store' });
			if (resp.ok) {
				const json = await resp.json();
				const ver = (json.tag_name || '').replace(/^v/i, '');
				if (ver && isNewerVersion(ver, APP_VERSION)) return { status: 'found', remoteVersion: ver };
				return { status: 'latest' };
			}
		} catch (e) { /* GitHub API 失败，尝试备用 */ }
		// 备用 API
		try {
			const resp = await fetch(FALLBACK_API, { cache: 'no-store' }); if (!resp.ok) return { status: 'error' };
			const json = await resp.json(); const data = json.data || json;
			const ver = (data.version || '').replace(/^v/i, '');
			if (ver && isNewerVersion(ver, APP_VERSION)) return { status: 'found', remoteVersion: ver };
			return { status: 'latest' };
		} catch (e) { return { status: 'error' }; }
	}
	// ===== 生命周期 =====
	function onPanelReady(panelEl) {
		try {
			console.log('[AB] ✅ AI 面板已检测到');
			createSettingsUI(panelEl);
			TokenTracker.observePanel(panelEl);
			applyColorSettings(); applyFontsizeSettings();
			applyCopySettings(panelEl); applyHotkeySettings();
			applyAutoAcceptSettings(panelEl);
			if (currentSettings.latexEnabled) applyLatexSettings(panelEl);
			if (currentSettings.mermaidEnabled) applyMermaidSettings(panelEl);
			if (currentSettings.autoUpdateEnabled) {
				setTimeout(async () => {
					const res = await checkForUpdate();
					if (res && res.status === 'found') {
						const toastFn = panelEl._abShowToast;
						if (toastFn) toastFn(t('toast_new_version') + 'v' + res.remoteVersion, { persistent: true });
					}
				}, 8000);
			}
		} catch (err) {
			console.error('[AB] 🚨 onPanelReady 严重崩溃:', err);
		}
	}
	function waitForAgentPanel() {
		function checkAndMount() {
			const p = document.querySelector('.antigravity-agent-side-panel');
			if (p && !p.querySelector('#ab-settings-btn')) {
				onPanelReady(p);
			}
		}
		checkAndMount();
		// 持续监听以支持用户在左侧侧边栏切换 Tab (如切到 Git/Explorer 再切回 AI 面板) 时的重新挂载 (防抖避免高频触发)
		let debounceTimer = null;
		const obs = new MutationObserver(() => {
			if (debounceTimer) return;
			debounceTimer = setTimeout(() => {
				debounceTimer = null;
				checkAndMount();
			}, 500);
		});
		obs.observe(document.body, { childList: true, subtree: true });
		console.log('[AB] ⏳ 持续监控 AI 面板挂载状态...');
	}
	// ===== 自动关闭"安装损坏"通知 =====
	function dismissCorruptWarning() {
		if (!currentSettings.dismissCorruptEnabled) return;
		const keywords = ['损坏', '重新安装', 'corrupt', 'reinstall'];
		function tryDismiss() {
			document.querySelectorAll('.notification-toast, .notifications-toasts .notification-list-item').forEach(toast => {
				const text = (toast.textContent || '').toLowerCase();
				if (keywords.some(k => text.includes(k))) {
					const closeBtn = toast.querySelector('.codicon-notifications-clear, .codicon-close, .action-label[title*="Close"], .action-label[title*="关闭"], .clear-notification-action');
					if (closeBtn) { closeBtn.click(); console.log('[AB] ✅ 已自动关闭安装损坏通知'); }
					else { toast.style.display = 'none'; console.log('[AB] ✅ 已隐藏安装损坏通知'); }
				}
			});
		}
		// 通知可能延迟出现，持续监听 30 秒；用节流避免流式回答的每个
		// DOM 片段都触发一次全页面 querySelectorAll。
		let dismissTimer = null;
		const obs = new MutationObserver(() => {
			if (dismissTimer) return;
			dismissTimer = setTimeout(() => {
				dismissTimer = null;
				tryDismiss();
			}, 250);
		});
		obs.observe(document.body, { childList: true, subtree: true });
		setTimeout(() => {
			obs.disconnect();
			if (dismissTimer) clearTimeout(dismissTimer);
			dismissTimer = null;
		}, 30000);
		setTimeout(tryDismiss, 2000);
	}
	function init() {
		console.log('[AB] 开始初始化...');
		try { applyColorSettings(); applyFontsizeSettings(); waitForAgentPanel(); dismissCorruptWarning(); TokenTracker.start(); console.log('[AB] ✅ 初始化完成'); } catch (e) { console.error('[AB] ❌ 初始化失败:', e); }
	}
	if (document.body) { setTimeout(init, 1000); } else { document.addEventListener('DOMContentLoaded', () => setTimeout(init, 1000)); }
})();
</script>
