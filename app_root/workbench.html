	<!-- Workbench CSS -->
	<link rel="stylesheet" href="../../../workbench/workbench.desktop.main.css">
	<style>
		/* ===== Antigravity Better v0.3.0 ===== */
		:root {
			--color-user-message: #60A5FA;
			--color-ai-response: #E0E0E0;
			--color-code-block: #A78BFA;
			--color-action-status: #4ADE80;
			--color-thinking: #9CA3AF;
			--fontsize-user-message: 14px;
			--fontsize-ai-response: 14px;
			--fontsize-code-block: 13px;
			--fontsize-action-status: 13px;
			--fontsize-thinking: 13px;
			--bg-modal: #1e1e1e;
			--border-color: #3c3c3c;
			--accent-color: #667eea;
			--text-main: #fff;
			--text-sub: #999;
		}
		/* 悬浮按钮 (absolute in side-panel) */
		#ab-settings-btn { position:absolute; right:10px; top:66%; transform:translateY(-50%); width:36px; height:36px; background:rgba(255,255,255,.08); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.12); border-radius:50%; cursor:pointer; box-shadow:0 2px 12px rgba(0,0,0,.2); z-index:9999; transition:all .35s cubic-bezier(.34,1.56,.64,1); }
		#ab-settings-btn:hover { background:rgba(102,126,234,.15); border-color:rgba(102,126,234,.4); box-shadow:0 0 20px rgba(102,126,234,.25),0 4px 16px rgba(0,0,0,.2); transform:translateY(-50%) scale(1.1); }
		#ab-settings-btn svg { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:17px; height:17px; fill:rgba(255,255,255,.6); transition:all .4s ease; }
		#ab-settings-btn:hover svg { fill:#a5b4fc; transform:translate(-50%,-50%) rotate(90deg); }
		/* 遮罩层 (absolute in side-panel) */
		#ab-overlay { position:absolute; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,.5); z-index:10000; display:none; opacity:0; transition:opacity .3s ease; align-items:center; justify-content:center; }
		#ab-overlay.show { display:flex; }
		#ab-overlay.visible { opacity:1; }
		/* 弹窗 */
		#ab-modal { background:var(--bg-modal); border-radius:12px; width:400px; max-width:90%; height:600px; max-height:85%; display:flex; flex-direction:column; box-shadow:0 8px 32px rgba(0,0,0,.4); border:1px solid var(--border-color); transform:scale(.9); transition:transform .3s cubic-bezier(.34,1.56,.64,1); overflow:hidden; }
		#ab-overlay.visible #ab-modal { transform:scale(1); }
		/* Header */
		.ab-header { padding:16px 20px; border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:flex-start; background:rgba(255,255,255,.02); }
		.ab-header-left { display:flex; flex-direction:column; }
		.ab-brand { color:var(--text-main); font-size:16px; font-weight:700; background:linear-gradient(90deg,#fff,#a5b4fc); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
		.ab-version { font-size:10px; color:var(--text-sub); background:rgba(255,255,255,.1); padding:2px 6px; border-radius:4px; margin-left:8px; font-weight:normal; -webkit-text-fill-color:var(--text-sub); }
		.ab-brand-links { display:flex; gap:12px; margin-top:4px; }
		.ab-brand-link { color:var(--text-sub); font-size:10px; text-decoration:none; transition:color .2s; }
		.ab-brand-link:hover { color:var(--accent-color); }
		.ab-header-right { display:flex; align-items:center; gap:12px; }
		.ab-lang-switch { background:none; border:1px solid var(--border-color); color:var(--text-sub); font-size:11px; padding:4px 8px; border-radius:4px; cursor:pointer; transition:all .2s; }
		.ab-lang-switch:hover { border-color:var(--text-main); color:var(--text-main); }
		.ab-close { background:none; border:none; color:var(--text-sub); font-size:18px; cursor:pointer; padding:6px; width:32px; height:32px; line-height:1; transition:all .2s; border-radius:6px; display:flex; align-items:center; justify-content:center; }
		.ab-close:hover { color:var(--text-main); background:rgba(255,255,255,.1); }
		/* Tab 导航 */
		.ab-tab-nav { display:flex; border-bottom:1px solid var(--border-color); padding:0 10px; background:rgba(0,0,0,.1); }
		.ab-tab-btn { flex:1; background:none; border:none; color:var(--text-sub); padding:12px 12px; min-height:42px; font-size:13px; cursor:pointer; position:relative; transition:all .2s; box-sizing:border-box; outline:none; display:flex; align-items:center; justify-content:center; gap:4px; }
		.ab-tab-btn:hover { color:var(--text-main); }
		.ab-tab-btn.active { color:var(--accent-color); font-weight:600; }
		.ab-tab-btn.active::after { content:''; position:absolute; bottom:-1px; left:0; width:100%; height:2px; background:var(--accent-color); }
		/* Tab 内容 */
		.ab-body { flex:1; overflow-y:auto; padding:0; }
		.ab-tab-content { display:none; animation:abFadeIn .2s ease; }
		.ab-tab-content.active { display:block; }
		@keyframes abFadeIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
		/* 手风琴 */
		.ab-accordion { border-bottom:1px solid var(--border-color); }
		.ab-accordion-header { padding:14px 20px; background:rgba(255,255,255,.01); cursor:pointer; display:flex; justify-content:space-between; align-items:center; transition:background .2s; }
		.ab-accordion-header:hover { background:rgba(255,255,255,.03); }
		.ab-accordion-title { font-size:13px; font-weight:600; color:var(--text-main); display:flex; align-items:center; gap:8px; }
		.ab-accordion-icon { transition:transform .3s; }
		.ab-accordion.expanded .ab-accordion-icon { transform:rotate(180deg); }
		.ab-accordion-body { max-height:0; overflow:hidden; transition:max-height .3s cubic-bezier(0,1,0,1); background:rgba(0,0,0,.1); }
		.ab-accordion.expanded .ab-accordion-body { max-height:1000px; transition:max-height .3s ease-in-out; }
		.ab-accordion-inner { padding:16px 20px; }
		/* 通用控件 */
		.ab-main-toggle { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; background:rgba(102,126,234,.1); border:1px solid rgba(102,126,234,.2); border-radius:8px; margin-bottom:12px; }
		.ab-main-toggle-label { color:var(--text-main); font-size:13px; font-weight:500; }
		.ab-setting { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.05); }
		.ab-setting:last-child { border-bottom:none; }
		.ab-setting-left { display:flex; align-items:center; gap:10px; }
		.ab-setting-icon { width:20px; color:var(--text-sub); }
		.ab-setting-name { color:#ccc; font-size:13px; line-height:28px; }
		.ab-setting-right { display:flex; align-items:center; gap:8px; }
		.ab-setting-desc { font-size:11px; color:var(--text-sub); margin-bottom:12px; line-height:1.5; }
		/* Toggle Switch */
		.ab-toggle { position:relative; display:inline-block; width:32px; height:18px; flex-shrink:0; }
		.ab-toggle input { display:none !important; }
		.ab-toggle-slider { position:absolute; cursor:pointer; top:0;left:0;right:0;bottom:0; background-color:#3c3c3c; transition:.3s; border-radius:20px; }
		.ab-toggle-slider:before { position:absolute; content:""; height:12px; width:12px; left:3px; bottom:3px; background-color:#fff; transition:.3s; border-radius:50%; }
		.ab-toggle input:checked+.ab-toggle-slider { background:var(--accent-color); }
		.ab-toggle input:checked+.ab-toggle-slider:before { transform:translateX(14px); }
		/* Color/Select/FontSize Input */
		.ab-color-input { width:24px; height:24px; border:1px solid var(--border-color); border-radius:4px; cursor:pointer; padding:0; background:none; }
		.ab-color-input::-webkit-color-swatch-wrapper { padding:2px; }
		.ab-color-input::-webkit-color-swatch { border-radius:2px; border:none; }
		.ab-select-input { background:#2d2d2d !important; border:1px solid var(--border-color) !important; border-radius:6px !important; padding:0 8px !important; color:#ccc !important; font-size:12px !important; cursor:pointer; outline:none !important; min-width:110px; height:28px !important; line-height:28px !important; box-sizing:border-box; -webkit-appearance:menulist; appearance:menulist; }
		.ab-select-input:focus { border-color:var(--accent-color) !important; outline:none !important; }
		.ab-select-input option { background:#2d2d2d; color:#ccc; }
		.ab-fontsize-input { width:60px !important; background:#2d2d2d !important; border:1px solid var(--border-color) !important; border-radius:6px !important; padding:2px 4px !important; color:#ccc !important; font-size:12px !important; text-align:center; outline:none !important; height:28px !important; box-sizing:border-box; }
		.ab-fontsize-input:focus { border-color:var(--accent-color) !important; outline:none !important; }
		.ab-fontsize-input::-webkit-inner-spin-button { opacity:0; height:24px; cursor:pointer; transition:opacity .2s; }
		.ab-fontsize-input:focus::-webkit-inner-spin-button { opacity:1; }
		/* 按钮组 */
		.ab-btn-group { display:flex; gap:10px; margin-top:10px; }
		.ab-btn { flex:1; padding:8px; border-radius:6px; border:none; cursor:pointer; font-size:12px; transition:all .2s; }
		.ab-btn.primary { background:var(--accent-color); color:#fff; }
		.ab-btn.primary:hover { filter:brightness(1.1); }
		.ab-btn.secondary { background:rgba(255,255,255,.1); color:#ccc; border:1px solid var(--border-color); }
		.ab-btn.secondary:hover { background:rgba(255,255,255,.15); }
		.ab-icon-btn { background:transparent; border:none; padding:2px 6px; border-radius:4px; font-size:13px; line-height:1; cursor:pointer; transition:all .15s ease; opacity:0.8; }
		.ab-icon-btn:hover { background:rgba(239,68,68,.15); opacity:1; }
		.ab-save-status { font-size:11px; text-align:center; margin-top:8px; min-height:16px; color:#4ADE80; }
		/* 同步按钮 */
		.ab-sync-btn { background:rgba(102,126,234,.2); border:1px solid rgba(102,126,234,.3); color:var(--accent-color); font-size:11px; padding:3px 8px; border-radius:4px; cursor:pointer; transition:all .2s; white-space:nowrap; }
		.ab-sync-btn:hover { background:rgba(102,126,234,.4); }
		/* Pattern Grid (Auto Accept) */
		.ab-pattern-grid { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
		.ab-pattern-item { display:flex; align-items:center; gap:6px; padding:6px 10px; background:rgba(0,0,0,.3); border:1px solid var(--border-color); border-radius:6px; cursor:pointer; transition:all .2s; font-size:12px; color:#ccc; }
		.ab-pattern-item:hover { background:rgba(255,255,255,.05); }
		.ab-pattern-item.active { border-color:var(--accent-color); background:rgba(102,126,234,.15); color:var(--text-main); }
		.ab-pattern-item input[type="checkbox"] { accent-color:var(--accent-color); width:14px; height:14px; cursor:pointer; outline:none !important; box-shadow:none !important; border:none !important; }
		/* 统计面板 */
		.ab-stats-panel { display:flex; justify-content:space-around; padding:12px; background:rgba(0,0,0,.2); border-radius:8px; margin-top:12px; }
		.ab-stat-item { text-align:center; flex:1; }
		.ab-stat-icon { margin-bottom:4px; }
		.ab-stat-value { display:block; font-size:18px; font-weight:700; color:var(--text-main); }
		.ab-stat-label { font-size:10px; color:var(--text-sub); text-transform:uppercase; }
		/* Textarea */
		.ab-textarea { width:100% !important; min-height:100px; background:rgba(0,0,0,.3) !important; border:1px solid var(--border-color) !important; border-radius:6px !important; color:#ccc !important; font-family:'Consolas','Monaco',monospace; font-size:11px !important; padding:10px !important; resize:vertical; outline:none !important; box-sizing:border-box; }
		.ab-textarea:focus { border-color:var(--accent-color) !important; outline:none !important; }
		/* Toast */
		#ab-toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.85); color:#fff; padding:10px 20px; border-radius:20px; font-size:13px; z-index:20000; display:none; opacity:0; transition:opacity .3s ease,top .3s ease; box-shadow:0 4px 12px rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.1); cursor:default; max-width:90%; text-align:center; }
		#ab-toast.show { display:flex; align-items:center; gap:8px; opacity:1; top:28px; }
		#ab-toast.warn { background:rgba(220,38,38,.92); border-color:rgba(255,100,100,.4); animation:abToastPulse 2s ease-in-out infinite; }
            #ab-toast.success { background:rgba(16,185,129,.92); border-color:rgba(100,255,150,.4); }
		@keyframes abToastPulse { 0%,100%{box-shadow:0 4px 12px rgba(220,38,38,.3)} 50%{box-shadow:0 4px 20px rgba(220,38,38,.6)} }
		#ab-toast .ab-toast-close { background:none; border:none; color:rgba(255,255,255,.7); font-size:16px; cursor:pointer; padding:0 0 0 4px; line-height:1; }
		#ab-toast .ab-toast-close:hover { color:#fff; }
		/* ===== 颜色覆盖 (V0.2 选择器) ===== */
		body.color-user-message .antigravity-agent-side-panel .bg-gray-500\/15 .whitespace-pre-wrap,
		body.color-user-message .antigravity-agent-side-panel .bg-gray-500\/15 [style*="word-break"] { color:var(--color-user-message) !important; }
		body.color-ai-response .antigravity-agent-side-panel .leading-relaxed.select-text:not(.opacity-70) p,
		body.color-ai-response .antigravity-agent-side-panel .leading-relaxed.select-text:not(.opacity-70) li,
		body.color-ai-response .antigravity-agent-side-panel .leading-relaxed.select-text:not(.opacity-70) h1,
		body.color-ai-response .antigravity-agent-side-panel .leading-relaxed.select-text:not(.opacity-70) h2,
		body.color-ai-response .antigravity-agent-side-panel .leading-relaxed.select-text:not(.opacity-70) h3,
		body.color-ai-response .antigravity-agent-side-panel .leading-relaxed.select-text:not(.opacity-70) h4,
		body.color-ai-response .antigravity-agent-side-panel .leading-relaxed.select-text:not(.opacity-70) strong,
		body.color-ai-response .antigravity-agent-side-panel .leading-relaxed.select-text:not(.opacity-70) ul,
		body.color-ai-response .antigravity-agent-side-panel .leading-relaxed.select-text:not(.opacity-70) ol,
		body.color-ai-response .antigravity-agent-side-panel .leading-relaxed.select-text:not(.opacity-70) table,
		body.color-ai-response .antigravity-agent-side-panel .leading-relaxed.select-text:not(.opacity-70) th,
		body.color-ai-response .antigravity-agent-side-panel .leading-relaxed.select-text:not(.opacity-70) td { color:var(--color-ai-response) !important; }
		body.color-code-block .antigravity-agent-side-panel .leading-relaxed pre,
		body.color-code-block .antigravity-agent-side-panel .leading-relaxed pre code,
		body.color-code-block .antigravity-agent-side-panel .leading-relaxed pre span,
		body.color-code-block .antigravity-agent-side-panel .leading-relaxed code.whitespace-pre-wrap { color:var(--color-code-block) !important; }
		body.color-thinking .antigravity-agent-side-panel .leading-relaxed.select-text.opacity-70,
		body.color-thinking .antigravity-agent-side-panel .leading-relaxed.select-text.opacity-70 * { color:var(--color-thinking) !important; }
		/* ===== 字体大小覆盖 (V0.2 选择器) ===== */
		body.fontsize-user-message .antigravity-agent-side-panel .bg-gray-500\/15 .whitespace-pre-wrap,
		body.fontsize-user-message .antigravity-agent-side-panel .bg-gray-500\/15 [style*="word-break"] { font-size:var(--fontsize-user-message) !important; }
		body.fontsize-ai-response .antigravity-agent-side-panel .leading-relaxed.select-text:not(.opacity-70) p,
		body.fontsize-ai-response .antigravity-agent-side-panel .leading-relaxed.select-text:not(.opacity-70) li,
		body.fontsize-ai-response .antigravity-agent-side-panel .leading-relaxed.select-text:not(.opacity-70) h2,
		body.fontsize-ai-response .antigravity-agent-side-panel .leading-relaxed.select-text:not(.opacity-70) h3,
		body.fontsize-ai-response .antigravity-agent-side-panel .leading-relaxed.select-text:not(.opacity-70) strong,
		body.fontsize-ai-response .antigravity-agent-side-panel .leading-relaxed.select-text:not(.opacity-70) ul,
		body.fontsize-ai-response .antigravity-agent-side-panel .leading-relaxed.select-text:not(.opacity-70) ol,
		body.fontsize-ai-response .antigravity-agent-side-panel .leading-relaxed.select-text:not(.opacity-70) table,
		body.fontsize-ai-response .antigravity-agent-side-panel .leading-relaxed.select-text:not(.opacity-70) th,
		body.fontsize-ai-response .antigravity-agent-side-panel .leading-relaxed.select-text:not(.opacity-70) td { font-size:var(--fontsize-ai-response) !important; }
		body.fontsize-code-block .antigravity-agent-side-panel .leading-relaxed pre,
		body.fontsize-code-block .antigravity-agent-side-panel .leading-relaxed pre code,
		body.fontsize-code-block .antigravity-agent-side-panel .leading-relaxed pre span { font-size:var(--fontsize-code-block) !important; }
		body.fontsize-thinking .antigravity-agent-side-panel .leading-relaxed.select-text.opacity-70,
		body.fontsize-thinking .antigravity-agent-side-panel .leading-relaxed.select-text.opacity-70 * { font-size:var(--fontsize-thinking) !important; }
		/* ===== 复制按钮 ===== */
		.copy-btn { position:absolute; top:6px; right:26px; width:26px; height:26px; background:rgba(60,60,60,.9); border:1px solid rgba(255,255,255,.1); border-radius:5px; cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:0; transition:all .2s ease; z-index:10; }
		.copy-btn svg { width:14px; height:14px; fill:#ccc; }
		.copy-btn:hover { background:rgba(102,126,234,.8); border-color:rgba(102,126,234,.5); }
		.copy-btn:hover svg { fill:#fff; }
		.copy-btn.copied { background:rgba(74,222,128,.8); }
		.copy-btn.copied svg { fill:#fff; }
		.copy-target { position:relative; }
		.copy-target:hover .copy-btn { opacity:1; }
		/* ===== LaTeX 公式 ===== */
		.latex-block { display:block; text-align:center; margin:1em 0; overflow-x:auto; }
		.latex-error { color:#f87171; font-size:12px; background:rgba(248,113,113,.1); padding:2px 6px; border-radius:3px; font-family:monospace; }
		.latex-code-rendered { padding:16px; text-align:center; overflow-x:auto; }
		.latex-code-rendered .katex { font-size:1.1em; }
		/* v0.2.2-patch: 行内公式样式 */
		.latex-inline { display:inline; }
		.latex-inline .katex { font-size:1em; }
		/* ===== Mermaid 图表 ===== */
		.mermaid-code-rendered { padding:14px 10px; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow-x:auto; background:rgba(0,0,0,.15); border-top:1px solid rgba(255,255,255,.06); position:relative; min-height:60px; border-radius:0 0 6px 6px; }
		.vscode-light .mermaid-code-rendered { background:rgba(0,0,0,.03); border-top:1px solid rgba(0,0,0,.06); }
		.mermaid-svg-wrapper { width:100%; display:flex; justify-content:center; align-items:center; overflow-x:auto; }
		.mermaid-svg-wrapper svg { max-width:100%; height:auto; display:block; }

		function t(key) { return (T[currentSettings.lang] || T.zh)[key] || key; }
		function getOfficialPricingNotesHTML() {
			const heading = '<div style="display:flex;align-items:center;gap:6px;font-weight:600;color:#cbd5e1;margin-bottom:4px;">' +
				'<span data-i18n="official_pricing_notes" data-i18n-prefix="💡 ">💡 ' + t('official_pricing_notes') + '</span>' +
				'</div>';
			const notes = ['notes_gemini_flash', 'notes_gemini_pro', 'notes_claude', 'notes_gpt_oss', 'notes_cache_hit']
				.map(key => '<div>• ' + t(key) + '</div>')
				.join('');
			return heading + notes;
		}
		function getLocalizedModelName(value) {
			const name = String(value || '').trim();
			if (!name || name === '未知模型' || name.toLowerCase() === 'unknown model') return t('unknown_model');
			if (name === '默认模型' || name.toLowerCase() === 'default model') return t('default_model');
			if (name === '用户自定义' || name.toLowerCase() === 'user custom') return t('user_custom_model');
			return name;
		}

			const cacheWrite5mTokens = Math.max(0, Number(r && r.cacheWrite5mTokens) || 0);
			const cacheWrite1hTokens = Math.max(0, Number(r && r.cacheWrite1hTokens) || 0);
			const normalizedCacheWriteTokens = Math.max(cacheWriteTokens, cacheWrite5mTokens + cacheWrite1hTokens);
			const rawCost = r && (r.costUsd !== undefined ? r.costUsd : r.cost);
			const parsedCost = Number(rawCost);
			const normalizedCost = rawCost === null || rawCost === undefined || !Number.isFinite(parsedCost) ? null : Math.max(0, parsedCost);
			const reported = Number(r && r.totalTokens) || 0;
			const legacyWithCacheWrite = reported > 0 && normalizedCacheWriteTokens > 0 && Math.abs(reported - (inTokens + outTokens + cacheTokens + normalizedCacheWriteTokens)) <= 2;
			const legacyWithCacheRead = reported > 0 && Math.abs(reported - (inTokens + outTokens + cacheTokens)) <= 2;
			const legacyExtra = legacyWithCacheWrite ? cacheTokens + normalizedCacheWriteTokens : (legacyWithCacheRead ? cacheTokens : 0);
			const totalInTokens = inTokens + legacyExtra;
			return {
				...sourceRecord,
				timestamp: normalizedTimestamp || sourceRecord.timestamp || 0,
				dateStr: sourceRecord.dateStr || (normalizedTimestamp ? formatLocalDate(normalizedTimestamp) : ''),
				inTokens: totalInTokens,
				outTokens,
				cacheTokens,
				cacheWriteTokens: normalizedCacheWriteTokens,
				cacheWrite5mTokens,
				cacheWrite1hTokens,
				totalTokens: totalInTokens + outTokens,
				costUsd: normalizedCost,
				cacheKnown: this.inferCacheKnown(r),
				costKnown: this.inferCostKnown(r)
			};
		},
			initDB() {
				if (this.db) return Promise.resolve(this.db);
				return new Promise((resolve, reject) => {
					let settled = false;
					const finish = (fn, value) => {
						if (settled) return;
						settled = true;
						clearTimeout(timeoutId);
						fn(value);
					};
					const timeoutId = setTimeout(() => {
						console.warn('[AB] IndexedDB init timed out');
						finish(reject, new Error('IndexedDB initialization timed out'));
					}, 8000);
					try {
						const req = indexedDB.open(IDB_NAME, IDB_VERSION);
						req.onupgradeneeded = (e) => {
							const db = e.target.result;
							const upgradeTx = e.target.transaction;
							let store;
							if (db.objectStoreNames.contains(IDB_STORE)) {
								store = upgradeTx.objectStore(IDB_STORE);
							} else {
								store = db.createObjectStore(IDB_STORE, { keyPath: 'id', autoIncrement: true });
							}
							const ensureIndex = (name, keyPath) => {
								const hasIndex = store.indexNames && typeof store.indexNames.contains === 'function'
									? store.indexNames.contains(name)
									: Array.from(store.indexNames || []).includes(name);
								if (!hasIndex) store.createIndex(name, keyPath, { unique: false });
							};
							ensureIndex('timestamp', 'timestamp');
							ensureIndex('modelId', 'modelId');
							ensureIndex('dateStr', 'dateStr');
							// Repair seconds/ISO timestamps while the v1 -> v2 upgrade
							// transaction is still active, so the timestamp index is usable.
							if (store.openCursor) {
								const cursorReq = store.openCursor();
								cursorReq.onsuccess = (cursorEvent) => {
									const cursor = cursorEvent.target.result;
									if (!cursor) return;
									const value = cursor.value;
									const ts = normalizeTimestampValue(value && value.timestamp, value && value.dateStr);
									if (ts > 0 && Number(value.timestamp) !== ts) {
										value.timestamp = ts;
										value.dateStr = value.dateStr || formatLocalDate(ts);
										cursor.update(value);
									}
									cursor.continue();
								};
							}
						};
						req.onsuccess = (e) => {
							const openedDb = e.target.result;
							this.db = openedDb;
							openedDb.onversionchange = () => {
								try { openedDb.close(); } catch (closeError) {}
								if (this.db === openedDb) this.db = null;
							};
							finish(resolve, openedDb);
						};
						req.onerror = (e) => {
							const err = e.target.error || new Error('Unknown error');
							console.error('[AB] IndexedDB init error:', err);
							finish(reject, err);
						};
						req.onblocked = () => {
							console.warn('[AB] IndexedDB blocked');
							finish(reject, new Error('IndexedDB upgrade blocked'));
						};
					} catch (e) {
						console.error('[AB] IndexedDB exception:', e);
						finish(reject, e);
					}
				});
			},
                getSummary() {
			try {
				const raw = localStorage.getItem(STORAGE_KEY_SUMMARY);
				if (raw) return JSON.parse(raw);
			} catch (e) {}
			return {
				totalTokens: 0,
				totalCostUsd: 0,
				todayTokens: 0,
				todayCostUsd: 0,
				totalCacheTokens: 0,
				todayCacheTokens: 0,
				totalInTokens: 0,
				todayInTokens: 0,
				totalCacheKnown: true,
				todayCacheKnown: true,
				totalCostKnown: true,
				todayCostKnown: true,
				lastDateStr: formatLocalDate()
			};
		},
		saveSummary(sum) {
			try {
				localStorage.setItem(STORAGE_KEY_SUMMARY, JSON.stringify(sum));
			} catch (e) {}
		},
		purgeCorruptTodayEstimates() {
			return new Promise((resolve) => {
				this.queryRange('today').then(records => {
					if (!records || !records.length) return resolve(0);
					const db = this.db;
					if (!db) return resolve(0);
					try {
						const tx = db.transaction([IDB_STORE], 'readwrite');
						const store = tx.objectStore(IDB_STORE);
						let purged = 0;
						const numFields = ['inTokens', 'outTokens', 'cacheTokens', 'totalTokens', 'costUsd'];
						records.forEach(r => {
							const structurallyInvalid = numFields.some(field =>
								Object.prototype.hasOwnProperty.call(r, field) &&
								r[field] !== null &&
								(!Number.isFinite(Number(r[field])) || Number(r[field]) < 0)
							);
							if (r.source === 'dom-estimate' && structurallyInvalid) {
								store.delete(r.id);
								purged++;
							}
						});
						tx.oncomplete = () => resolve(purged);
						tx.onerror = () => resolve(0);
					} catch (e) { resolve(0); }
				}).catch(() => resolve(0));
			});
		},
		recalculateSummary() {
			return new Promise((resolve) => {
				this.queryRange('all').then(records => {
					const todayStr = formatLocalDate();
					let totalTokens = 0, totalCostUsd = 0, todayTokens = 0, todayCostUsd = 0;
					let totalCacheTokens = 0, todayCacheTokens = 0;
					let totalInTokens = 0, todayInTokens = 0;
					let totalCacheKnown = true, todayCacheKnown = true;
					let totalCostKnown = true, todayCostKnown = true;

					records.forEach(raw => {
					const r = this.normalizeRecord(raw);
					const inOut = r.inTokens + r.outTokens;
					const ca = r.cacheTokens;
					const tot = r.totalTokens || inOut;
					const c = r.costUsd || 0;
					totalTokens += tot;
					totalCostUsd += c;
					totalCacheTokens += ca;
					totalInTokens += (r.inTokens || 0);
					if (r.cacheKnown === false && !(ca > 0)) totalCacheKnown = false;
					if (r.costKnown === false) totalCostKnown = false;

						const rDateStr = r.timestamp ? formatLocalDate(r.timestamp) : r.dateStr;
						if (rDateStr === todayStr) {
							todayTokens += tot;
							todayCostUsd += c;
							todayCacheTokens += ca;
							todayInTokens += (r.inTokens || 0);
							if (r.cacheKnown === false && !(ca > 0)) todayCacheKnown = false;
							if (r.costKnown === false) todayCostKnown = false;
						}
					});

					const sum = {
						totalTokens,
						totalCostUsd,
						todayTokens,
						todayCostUsd,
						totalCacheTokens,
						todayCacheTokens,
						totalInTokens,
						todayInTokens,
						totalCacheKnown: totalCacheTokens > 0 ? true : totalCacheKnown,
											todayCacheKnown: (todayCacheTokens > 0 || todayTokens > 0) ? true : todayCacheKnown,
						totalCostKnown,
											todayCostKnown: (todayCostUsd > 0 || (todayTokens > 0 && todayCostUsd !== null)) ? true : todayCostKnown,
						lastDateStr: todayStr
					};
					this.saveSummary(sum);
					this.notifyUpdate(sum);
					resolve(sum);
				}).catch(() => resolve(this.getSummary()));
			});
		},
		async record(modelId, modelName, inTokens, outTokens, cacheTokens, costUsd, customTimestamp = null, cacheWriteTokens = 0, metadata = null) {
			const safeInTokens = Math.max(0, Number(inTokens) || 0);
			const safeOutTokens = Math.max(0, Number(outTokens) || 0);
			const safeCacheTokens = Math.max(0, Number(cacheTokens) || 0);
			const safeCacheWriteTokens = Math.max(0, Number(cacheWriteTokens) || 0);
			const safeCacheWrite5mTokens = Math.max(0, Number(metadata && metadata.cacheWrite5mTokens) || 0);
			const safeCacheWrite1hTokens = Math.max(0, Number(metadata && metadata.cacheWrite1hTokens) || 0);
			const normalizedCacheWriteTokens = Math.max(safeCacheWriteTokens, safeCacheWrite5mTokens + safeCacheWrite1hTokens);
			const parsedCostUsd = Number(costUsd);
			const safeCostUsd = costUsd === null || costUsd === undefined || !Number.isFinite(parsedCostUsd) ? null : Math.max(0, parsedCostUsd);
			const source = metadata && metadata.source ? String(metadata.source) : 'unknown';
			const isEstimateSource = source === 'dom-estimate' || source === 'offline-estimate';
			const safeCacheKnown = metadata && metadata.cacheKnown !== undefined ? !!metadata.cacheKnown : (source === 'offline-estimate' || safeCacheTokens > 0);
			const safeCostKnown = metadata && metadata.costKnown !== undefined ? !!metadata.costKnown : (isEstimateSource ? false : safeCostUsd !== null);
			const trackedSessionGeneration = metadata && Number.isInteger(Number(metadata.sessionGeneration))
				? Number(metadata.sessionGeneration) : null;
			const sessionIsCurrent = () => trackedSessionGeneration === null ||
				(typeof TokenTracker !== 'undefined' && TokenTracker.sessionGeneration === trackedSessionGeneration);
			if (!sessionIsCurrent()) return null;
			const ts = normalizeTimestampValue(customTimestamp) || Date.now();
			const dObj = new Date(ts);
			const dateStr = formatLocalDate(dObj);
			const hourStr = formatLocalHour(dObj);

			const rec = {
				timestamp: ts,
				dateStr,
				hourStr,
				modelId: modelId || 'unknown',
				modelName: modelName || t('unknown_model'),
				inTokens: safeInTokens,
				outTokens: safeOutTokens,
				cacheTokens: safeCacheTokens,
				cacheWriteTokens: normalizedCacheWriteTokens,
				cacheWrite5mTokens: safeCacheWrite5mTokens,
				cacheWrite1hTokens: safeCacheWrite1hTokens,
				totalTokens: (safeInTokens + safeOutTokens),
				costUsd: safeCostUsd,
				cacheKnown: safeCacheKnown,
				costKnown: safeCostKnown,
				source,
				estimated: metadata && metadata.estimated !== undefined ? !!metadata.estimated : true,
				usageKey: metadata && metadata.usageKey ? String(metadata.usageKey) : undefined,
				turnKey: metadata && metadata.turnKey ? String(metadata.turnKey) : undefined
			};

			// 写入 IndexedDB 并等待事务彻底持久化完成
			try {
				const db = await this.initDB();
				if (!db) {
					throw new Error('Database initialization failed');
				}
				if (!sessionIsCurrent()) return null;
				let insertedKey = null;
				await new Promise((resolve, reject) => {
					let tx = null;
					try {
						tx = db.transaction([IDB_STORE], 'readwrite');
						tx.oncomplete = () => resolve();
						tx.onerror = (e) => reject(tx.error || e);
						tx.onabort = () => reject(tx.error || new Error('tx aborted'));
						const addReq = tx.objectStore(IDB_STORE).add(rec);
						addReq.onsuccess = () => { insertedKey = addReq.result; };
					} catch (e) {
						try { if (tx) tx.abort(); } catch (abortError) {}
						reject(e);
					}
				});
				if (!sessionIsCurrent()) {
					if (insertedKey !== null && insertedKey !== undefined) {
						await new Promise((resolve, reject) => {
							let tx = null;
							try {
								tx = db.transaction([IDB_STORE], 'readwrite');
								tx.oncomplete = resolve;
								tx.onerror = () => reject(tx.error || new Error('Stale record cleanup failed'));
								tx.onabort = () => reject(tx.error || new Error('Stale record cleanup aborted'));
								tx.objectStore(IDB_STORE).delete(insertedKey);
							} catch (e) {
								reject(e);
							}
						});
					}
					return null;
				}

				// 数据库写入成功后再更新内存汇总，防止落库失败产生幽灵账单
				const sum = this.getSummary();
				if (sum.lastDateStr !== dateStr && customTimestamp == null) {
					sum.todayTokens = 0;
					sum.todayCostUsd = 0;
						sum.todayCacheTokens = 0;
						sum.todayInTokens = 0;
						sum.todayCacheKnown = true;
						sum.todayCostKnown = true;
						sum.lastDateStr = dateStr;
				}
				const incTotal = (safeInTokens + safeOutTokens);
				sum.totalTokens += incTotal;
				sum.totalCostUsd += safeCostUsd || 0;
				sum.totalCacheTokens = (sum.totalCacheTokens || 0) + safeCacheTokens;
				sum.totalInTokens = (sum.totalInTokens || 0) + safeInTokens;
				sum.totalCacheKnown = sum.totalCacheKnown !== false && safeCacheKnown;
				sum.totalCostKnown = sum.totalCostKnown !== false && safeCostKnown;
				if (dateStr === formatLocalDate()) {
					sum.todayTokens += incTotal;
					sum.todayCostUsd += safeCostUsd || 0;
					sum.todayCacheTokens = (sum.todayCacheTokens || 0) + safeCacheTokens;
					sum.todayInTokens = (sum.todayInTokens || 0) + safeInTokens;
					sum.todayCacheKnown = sum.todayCacheKnown !== false && safeCacheKnown;
					sum.todayCostKnown = sum.todayCostKnown !== false && safeCostKnown;
				}
				this.saveSummary(sum);
					this.notifyUpdate(sum);

			} catch (e) {
				console.error('[AB Analytics] 写入数据库失败, 已取消汇总更新:', e);
				return null;
			}

			return rec;
		},
		async queryRange(rangeType) {
			const db = await this.initDB();
			if (!db) return [];
			let minTime = 0;
			if (rangeType === 'today') {
				const d = new Date(); d.setHours(0, 0, 0, 0); minTime = d.getTime();
			} else if (rangeType === '7d' || rangeType === '30d') {
				// 图表槽位按自然日生成（今天 + 前 6/29 天），查询
				// 也必须从对应自然日零点开始，否则边界日会被取出
				// 后因没有槽位而静默丢掉。
				const days = rangeType === '7d' ? 7 : 30;
				const start = new Date();
				start.setHours(0, 0, 0, 0);
				start.setDate(start.getDate() - (days - 1));
				minTime = start.getTime();
			}
			return new Promise((resolve, reject) => {
				let tx = null;
				try {
					tx = db.transaction([IDB_STORE], 'readonly');
					const store = tx.objectStore(IDB_STORE);
					const range = minTime > 0 ? IDBKeyRange.lowerBound(minTime) : null;
					const hasTimestampIndex = store.indexNames && typeof store.indexNames.contains === 'function'
						? store.indexNames.contains('timestamp')
						: Array.from(store.indexNames || []).includes('timestamp');
					let req;
					if (hasTimestampIndex) {
						const index = store.index('timestamp');
						req = range ? index.getAll(range) : index.getAll();
					} else {
						// Databases created by early versions may have the object store
						// but no timestamp index. Keep charts usable until the upgrade
						// transaction can repair that store.
						req = store.getAll();
					}
					req.onsuccess = (e) => {
						let rows = e.target.result || [];
						if (minTime > 0 && !hasTimestampIndex) {
							rows = rows.filter(raw => normalizeTimestampValue(raw && raw.timestamp, raw && raw.dateStr) >= minTime);
						}
						resolve(rows);
					};
					req.onerror = () => reject(req.error || new Error('Query failed'));
					tx.onerror = () => reject(tx.error || new Error('Query transaction failed'));
					tx.onabort = () => reject(tx.error || new Error('Query transaction aborted'));
				} catch (e) {
					reject(e);
				}
			});
		},
		async getDailyBreakdown() {
			const records = await this.queryRange('all');
			const dayMap = {};
			records.forEach(raw => {
				const r = this.normalizeRecord(raw);
				const d = r.timestamp ? formatLocalDate(r.timestamp) : (r.dateStr || t('unknown_date'));
				if (!dayMap[d]) {
					dayMap[d] = {
						date: d,
						inTokens: 0,
						outTokens: 0,
						cacheTokens: 0,
						totalTokens: 0,
						costUsd: 0,
						turnsCount: 0,
						models: {},
						cacheKnown: true,
						costKnown: true
					};
				}
				const row = dayMap[d];
				const inT = r.inTokens;
				const outT = r.outTokens;
				const caT = r.cacheTokens;
				const totT = r.totalTokens;
				const c = r.costUsd || 0;
				row.inTokens += inT;
				row.outTokens += outT;
				row.cacheTokens += caT;
				row.totalTokens += totT;
				row.costUsd += c;
				if (r.cacheKnown === false) row.cacheKnown = false;
				if (r.costKnown === false) row.costKnown = false;
				row.turnsCount += 1;
				const mName = getLocalizedModelName(r.modelName || r.modelId || t('default_model'));
				row.models[mName] = (row.models[mName] || 0) + 1;
			});
			const list = Object.values(dayMap).sort((a, b) => b.date.localeCompare(a.date));
			if (list.length === 0) {
				const sum = this.getSummary();
				if ((sum.totalTokens || 0) > 0 || (sum.todayTokens || 0) > 0) {
					const todayStr = formatLocalDate();
					return [{
						date: todayStr,
						inTokens: 0,
						outTokens: sum.totalTokens || sum.todayTokens,
						cacheTokens: sum.totalCacheTokens || sum.todayCacheTokens || 0,
						totalTokens: sum.totalTokens || sum.todayTokens,
						costUsd: sum.totalCostUsd || sum.todayCostUsd || 0,
							turnsCount: 1,
							models: {},
							cacheKnown: sum.totalCacheKnown !== false,
							costKnown: sum.totalCostKnown !== false
					}];
				}
			}
			return list;
		},
		async clearToday() {
			try {
				const todayStr = formatLocalDate();
				const todayMidnight = new Date(); todayMidnight.setHours(0, 0, 0, 0);
				const minTs = todayMidnight.getTime();
				const db = await this.initDB();
				if (!db) return false;
				await new Promise((resolve, reject) => {
					let tx = null;
					try {
						tx = db.transaction([IDB_STORE], 'readwrite');
						const store = tx.objectStore(IDB_STORE);
						tx.oncomplete = resolve;
						tx.onerror = () => reject(tx.error || new Error('Clear today transaction failed'));
						tx.onabort = () => reject(tx.error || new Error('Clear today transaction aborted'));
						const req = store.openCursor();
						req.onsuccess = (e) => {
							const cursor = e.target.result;
							if (!cursor) return;
							const val = cursor.value || {};
							const valueTs = normalizeTimestampValue(val.timestamp, val.dateStr);
							const isToday = (valueTs >= minTs) || val.dateStr === todayStr;
							if (isToday) cursor.delete();
							cursor.continue();
						};
						req.onerror = () => reject(req.error || new Error('Clear today cursor failed'));
					} catch (e) {
						reject(e);
					}
				});
				await this.recalculateSummary();
				return true;
			} catch (e) {
				console.error('[AB Analytics] 清空今日用量失败:', e);
				return false;
			}
		},
		async clearHistory() {
			try {
				const db = await this.initDB();
				if (!db) return false;
				await new Promise((resolve, reject) => {
					let tx = null;
					try {
						tx = db.transaction([IDB_STORE], 'readwrite');
						tx.oncomplete = resolve;
						tx.onerror = () => reject(tx.error || new Error('Clear history transaction failed'));
						tx.onabort = () => reject(tx.error || new Error('Clear history transaction aborted'));
						const req = tx.objectStore(IDB_STORE).clear();
						req.onerror = () => reject(req.error || new Error('Clear history request failed'));
					} catch (e) {
						reject(e);
					}
				});
				try {
					localStorage.removeItem(STORAGE_KEY_SUMMARY);
				} catch (e) {
					console.warn('[AB Analytics] 清空汇总缓存失败:', e);
				}
				this.notifyUpdate({
					totalTokens: 0, totalCostUsd: 0, todayTokens: 0, todayCostUsd: 0, totalCacheTokens: 0, todayCacheTokens: 0,
					totalInTokens: 0, todayInTokens: 0, totalCacheKnown: true, todayCacheKnown: true,
					totalCostKnown: true, todayCostKnown: true, lastDateStr: formatLocalDate()
				});
				return true;
			} catch (e) {
				console.error('[AB Analytics] 清理历史失败:', e);
				return false;
			}
		},
		_lastExportTs: 0,
		async exportJSON(ev = null) {
			// 安全防护：杜绝任何自动化脚本的模拟触发与 3 秒内高频连击
			if (ev && ev.isTrusted === false) return;
			const now = Date.now();
			if (now - this._lastExportTs < 3000) return;
			this._lastExportTs = now;
			try {
				const records = await this.queryRange('all');
				const sum = this.getSummary();
				const daily = await this.getDailyBreakdown();
				const data = {
					exportedAt: new Date().toISOString(),
					version: APP_VERSION,
					summary: sum,
					dailyBreakdown: daily,
					records: records
				};
				const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
				const url = URL.createObjectURL(blob);
				const a = document.createElement('a');
				a.href = url;
				a.download = `antigravity_token_usage_${formatLocalDate()}.json`;
				document.body.appendChild(a);
				a.click();
				document.body.removeChild(a);
				URL.revokeObjectURL(url);
			} catch (e) {
				console.error('[AB Analytics] 导出用量失败:', e);
				if (window._abShowToast) window._abShowToast(t('toast_export_failed'), { warn: true });
			}
		},
		async importJSON(jsonData) {
			let db = null;
			let backupRecords = null;
			let storeWasReplaced = false;
			let runStoreTransaction = null;
			try {
				let text = jsonData;
				if (typeof text === 'string') {
					if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
					text = text.trim();
				}
				const obj = typeof text === 'string' ? JSON.parse(text) : text;
				const recs = Array.isArray(obj) ? obj : (obj && (obj.records || obj.data || obj.history || obj.list) || []);
				if (!Array.isArray(recs) || recs.length === 0) {
					return { success: false, count: 0, error: 'Empty or invalid records' };
				}

				const MAX_IMPORT_RECORDS = 250000;
				if (recs.length > MAX_IMPORT_RECORDS) {
					return { success: false, count: 0, error: 'Too many records (max 250,000)' };
				}

				// 先把所有记录完成校验和 schema 归一化，严格拒绝非有限数（Infinity/NaN）与负数
				const finiteNonNegative = (val, field, optional = true) => {
					if (val === undefined || val === null || val === '') {
						if (optional) return 0;
						throw new TypeError('Missing field: ' + field);
					}
					const parsed = Number(val);
					if (!Number.isFinite(parsed) || parsed < 0) {
						throw new TypeError('Invalid number for ' + field + ': ' + val);
					}
					return parsed;
				};

				const usageFields = [
					'totalTokens', 'inTokens', 'outTokens', 'inputTokens', 'outputTokens',
					'cacheTokens', 'cachedTokens', 'cacheWriteTokens', 'cachedWriteTokens',
					'cacheWrite5mTokens', 'cacheWrite1hTokens', 'costUsd', 'cost'
				];
				const preparedRecords = [];
				for (const r of recs) {
					if (!r || typeof r !== 'object' || !usageFields.some(field => Object.prototype.hasOwnProperty.call(r, field))) {
						throw new TypeError('Invalid record format encountered');
					}

					let rawIn = finiteNonNegative(r.inTokens !== undefined ? r.inTokens : r.inputTokens, 'inTokens');
					const outT = finiteNonNegative(r.outTokens !== undefined ? r.outTokens : r.outputTokens, 'outTokens');
					const caT = finiteNonNegative(r.cacheTokens !== undefined ? r.cacheTokens : r.cachedTokens, 'cacheTokens');
					const caW5 = finiteNonNegative(r.cacheWrite5mTokens, 'cacheWrite5mTokens');
					const caW1 = finiteNonNegative(r.cacheWrite1hTokens, 'cacheWrite1hTokens');
					const caW = Math.max(
						finiteNonNegative(r.cacheWriteTokens !== undefined ? r.cacheWriteTokens : r.cachedWriteTokens, 'cacheWriteTokens'),
						caW5 + caW1
					);
					const reportedTot = finiteNonNegative(r.totalTokens, 'totalTokens');

					if (rawIn === 0 && outT === 0 && caT === 0 && caW === 0 && (r.costUsd === undefined || r.costUsd === null)) {
						throw new TypeError('Semantically empty record');
					}

					// 兼容旧格式
					if (reportedTot > 0 && Math.abs(reportedTot - (rawIn + outT + caT + caW)) <= 2 && caW > 0) {
						rawIn += caT + caW;
					} else if (reportedTot > 0 && Math.abs(reportedTot - (rawIn + outT + caT)) <= 2) {
						rawIn += caT;
					}

					const rawModelId = r.modelId !== undefined ? r.modelId : r.model;
					let mId = typeof rawModelId === 'string' && /^[a-z0-9._:/-]{1,128}$/i.test(rawModelId.trim()) ? rawModelId.trim() : 'unknown';
					const rawModelName = r.modelName !== undefined ? r.modelName : r.model;
					let mName = typeof rawModelName === 'string' && rawModelName.trim() ? rawModelName.trim().slice(0, 200).replace(/[\u0000-\u001f]/g, '') : t('unknown_model');
					const resolved = PricingManager.resolve(mId) || PricingManager.resolve(mName);
					if (resolved) {
						mId = resolved.id;
						mName = resolved.name;
					}

					const importedCost = r.costUsd !== undefined ? r.costUsd : (r.cost !== undefined ? r.cost : null);
					const numericCost = importedCost === null || importedCost === undefined || !Number.isFinite(Number(importedCost))
						? null : Math.max(0, Number(importedCost));
					const importedSource = r.source || 'offline-estimate';
					const importedWithSource = { ...r, source: importedSource, costUsd: numericCost };
					const importedCacheKnown = this.inferCacheKnown(importedWithSource);
					const importedCostKnown = this.inferCostKnown(importedWithSource);
					const recTimestamp = normalizeTimestampValue(r.timestamp, r.dateStr) || Date.now();
					const recDate = new Date(recTimestamp);
					preparedRecords.push({
						timestamp: recTimestamp,
						dateStr: formatLocalDate(recDate),
						hourStr: formatLocalHour(recDate),
						modelId: mId,
						modelName: mName,
						inTokens: rawIn,
						outTokens: outT,
						cacheTokens: caT,
						cacheWriteTokens: caW,
						cacheWrite5mTokens: caW5,
						cacheWrite1hTokens: caW1,
						totalTokens: rawIn + outT,
						costUsd: numericCost,
						cacheKnown: importedCacheKnown,
						costKnown: importedCostKnown,
						source: importedSource,
						estimated: r.estimated !== undefined ? !!r.estimated : true,
						provenance: r.provenance || undefined,
						usageKey: r.usageKey || undefined,
						turnKey: r.turnKey || undefined
					});
				}
				if (preparedRecords.length === 0) {
					return { success: false, count: 0, error: 'No valid usage records' };
				}

				db = await this.initDB();
				if (!db) return { success: false, count: 0, error: 'IndexedDB init failed' };
				backupRecords = await this.queryRange('all');

				runStoreTransaction = (records, clearFirst = false) => new Promise((resolve, reject) => {
					let tx = null;
					try {
						tx = db.transaction([IDB_STORE], 'readwrite');
						tx.oncomplete = resolve;
						tx.onerror = () => reject(tx.error || new Error('Import transaction failed'));
						tx.onabort = () => reject(tx.error || new Error('Import transaction aborted'));

				await runStoreTransaction([], true);
				storeWasReplaced = true;
				const CHUNK_SIZE = 2000;
				for (let i = 0; i < preparedRecords.length; i += CHUNK_SIZE) {
					await runStoreTransaction(preparedRecords.slice(i, i + CHUNK_SIZE));
				}

				if (typeof TokenTracker !== 'undefined' && TokenTracker.markCurrentDOMTracked) {
					TokenTracker.markCurrentDOMTracked();
				}
				await this.recalculateSummary();
				return { success: true, count: preparedRecords.length };
			} catch (e) {
				if (storeWasReplaced && db && Array.isArray(backupRecords) && typeof runStoreTransaction === 'function') {
					try {
						await runStoreTransaction([], true);
						const CHUNK_SIZE = 2000;
						for (let i = 0; i < backupRecords.length; i += CHUNK_SIZE) {
							await runStoreTransaction(backupRecords.slice(i, i + CHUNK_SIZE));
						}

					} catch (restoreError) {
						console.error('[AB Analytics] 导入失败且原用量数据恢复失败:', restoreError);
					}
				}
				console.error('[AB Analytics] 导入用量数据失败:', e);

			}

_listeners: new Set(),
		onUpdate(fn) {
			if (typeof fn === 'function') {
				this._listeners.add(fn);
			}
			return () => this._listeners.delete(fn);

		notifyUpdate(sum) {
			const s = sum || this.getSummary();

// ===== 独立轻量原生矢量图表渲染引擎 (SvgChartEngine) =====
	const SvgChartEngine = window.SvgChartEngine = {
		render(container, records, options = {}) {
			if (!container) return;
			while (container.firstChild) container.removeChild(container.firstChild);
			if (!Array.isArray(records) || records.length === 0) {
				setChartStatus(container, 'chart_empty');
				return;
			}

			const opt = Object.assign({
				range: 'today',
				metric: 'tokens', // 'tokens' | 'cache' | 'cost'
				aggregateFlash: true,
				visibleModels: {},
				width: container.clientWidth || 600,
				height: container.clientHeight || 280
			}, options);

			const W = Math.max(320, opt.width);
			const H = Math.max(120, opt.height);
			const padL = 60, padR = 25, padT = 20, padB = 28;
			const plotW = Math.max(10, W - padL - padR);
			const plotH = Math.max(10, H - padT - padB);

			// 1. 生成时间槽位 Time Slots (统一切割为标准化时间段)
			const slots = [];
			const slotMap = {};
			const now = new Date();

			if (opt.range === 'today') {
			for (let h = 0; h < 24; h++) {
				const s = h.toString().padStart(2, '0') + ':00';
				slots.push(s);
				slotMap[s] = { label: s, fullDate: `${t('today_prefix')}${s}`, totalTokens: 0, inTokens: 0, outTokens: 0, cacheTokens: 0, totalCost: 0, models: {}, modelTokens: {}, modelCaches: {}, modelCosts: {} };
			}
			} else if (opt.range === '7d' || opt.range === '30d') {
				const days = opt.range === '7d' ? 7 : 30;
				for (let i = days - 1; i >= 0; i--) {
					const d = new Date(now);
					d.setHours(0, 0, 0, 0);
					d.setDate(d.getDate() - i);
					const s = (d.getMonth() + 1).toString().padStart(2, '0') + '/' + d.getDate().toString().padStart(2, '0');
					const full = formatLocalDate(d);
					slots.push(s);
					slotMap[s] = { label: s, fullDate: full, totalTokens: 0, inTokens: 0, outTokens: 0, cacheTokens: 0, totalCost: 0, models: {}, modelTokens: {}, modelCaches: {}, modelCosts: {} };
				}
			} else {
				// all: 彻底修复 "全部历史" 显示全 0 BUG (统一使用 MM/DD 槽位格式与 slotKey 一致)
				const dateKeys = {};
				(records || []).forEach(r => {
					const dStr = r.timestamp ? formatLocalDate(r.timestamp) : r.dateStr;
					if (dStr) dateKeys[dStr] = true;
				});
				const sortedDates = Object.keys(dateKeys).sort();
				const hasMultiYear = sortedDates.length > 0 && (sortedDates[0].slice(0, 4) !== sortedDates[sortedDates.length - 1].slice(0, 4));
				if (sortedDates.length <= 1) {
						for (let i = 6; i >= 0; i--) {
							const d = new Date(now);
							d.setHours(0, 0, 0, 0);
							d.setDate(d.getDate() - i);
							const full = formatLocalDate(d);
							const s = (d.getMonth() + 1).toString().padStart(2, '0') + '/' + d.getDate().toString().padStart(2, '0');
							slots.push(s);
							slotMap[s] = { label: s, fullDate: full, totalTokens: 0, inTokens: 0, outTokens: 0, cacheTokens: 0, totalCost: 0, models: {}, modelTokens: {}, modelCaches: {}, modelCosts: {} };
						}
						// 如果唯一历史日期早于最近 7 天，不能让“全部历史”把
						// 唯一一条记录落在视图之外而显示全 0。
						if (sortedDates.length === 1) {
							const onlyDate = sortedDates[0];
							if (!slots.some(key => slotMap[key] && slotMap[key].fullDate === onlyDate)) {
								slots.length = 0;
								Object.keys(slotMap).forEach(key => delete slotMap[key]);
								slots.push(onlyDate);
								slotMap[onlyDate] = { label: onlyDate.slice(2).replace(/-/g, '/'), fullDate: onlyDate, totalTokens: 0, inTokens: 0, outTokens: 0, cacheTokens: 0, totalCost: 0, models: {}, modelTokens: {}, modelCaches: {}, modelCosts: {} };
							}
						}
				} else {
					sortedDates.forEach(d => {
						const slotKey = hasMultiYear ? d : d.slice(5).replace('-', '/');
						const label = hasMultiYear ? d.slice(2).replace('-', '/') : d.slice(5).replace('-', '/');
						slots.push(slotKey);
						slotMap[slotKey] = { label: label, fullDate: d, totalTokens: 0, inTokens: 0, outTokens: 0, cacheTokens: 0, totalCost: 0, models: {}, modelTokens: {}, modelCaches: {}, modelCosts: {} };
					});
				}
			}

			// 2. 填充数据并支持 Flash 系列聚合 / 独立拆分
			const modelSet = {};
			let hasKnownCache = false, hasUnknownCache = false;
			let hasKnownCost = false, hasUnknownCost = false;
			(records || []).forEach(raw => {
				const r = AnalyticsStorage.normalizeRecord(raw);
				let mId = r.modelId || 'default';
				let mName = getLocalizedModelName(r.modelName || mId);

				if (opt.aggregateFlash && (mId.includes('flash') || ['gemini-3.8-flash', 'gemini-3.7-flash', 'gemini-3.6-flash'].includes(mId))) {
					mId = 'gemini-flash-aggregate';
					mName = t('lbl_flash_aggregate');
				}

				modelSet[mId] = mName;

				let slotKey = null;
				if (opt.range === 'today') {
					// 绝对优先基于时间戳换算当前设备本地小时（00~23），彻底杜绝 UTC 8小时时区偏差
					if (r.timestamp) {
						const rd = new Date(r.timestamp);
						slotKey = String(rd.getHours()).padStart(2, '0') + ':00';
					} else if (r.hourStr) {
						const hourNum = parseInt(r.hourStr.split(':')[0], 10) || 0;
						slotKey = hourNum.toString().padStart(2, '0') + ':00';
					}
				} else {
					if (r.timestamp) {
						const rd = new Date(r.timestamp);
						const m = String(rd.getMonth() + 1).padStart(2, '0');
						const day = String(rd.getDate()).padStart(2, '0');
						const fullDateKey = formatLocalDate(rd);
						const monthDayKey = `${m}/${day}`;
						// “全部历史”跨年时槽位带年份；7d/30d 及单年视图
						// 仍使用 MM/DD。必须以实际存在的槽位为准，避免跨年记录被丢弃。
						slotKey = slotMap[fullDateKey] ? fullDateKey : monthDayKey;
					} else if (r.dateStr) {
						const fullDateKey = String(r.dateStr);
						const monthDayKey = String(r.dateStr).slice(5).replace('-', '/');
						slotKey = slotMap[fullDateKey] ? fullDateKey : monthDayKey;
					}
				}

				if (slotKey && slotMap[slotKey]) {
					const inT = r.inTokens || 0;
					const outT = r.outTokens || 0;
					const cTokens = r.cacheTokens || 0;
					const tTokens = r.totalTokens ? r.totalTokens : (inT + outT);
					const cost = r.costUsd || 0;

					slotMap[slotKey].totalTokens += tTokens;
					slotMap[slotKey].inTokens += inT;
					slotMap[slotKey].outTokens = (slotMap[slotKey].outTokens || 0) + outT;
						slotMap[slotKey].cacheTokens += cTokens;
						slotMap[slotKey].totalCost += cost;
						if (r.cacheKnown === false) {
							hasUnknownCache = true;
							slotMap[slotKey].cacheKnown = false;
						} else {
							hasKnownCache = true;
						}
						if (r.costKnown === false) {
							hasUnknownCost = true;
							slotMap[slotKey].costKnown = false;
						} else {

					// 按当前视图指标决定模型数值 (Token 指标绘制该模型完整全部用量，虚线绘制缓存命中)
					let val = tTokens;
					if (opt.metric === 'cost') val = cost;

					slotMap[slotKey].models[mId] = (slotMap[slotKey].models[mId] || 0) + val;
					slotMap[slotKey].modelTokens[mId] = (slotMap[slotKey].modelTokens[mId] || 0) + tTokens;
					slotMap[slotKey].modelCaches[mId] = (slotMap[slotKey].modelCaches[mId] || 0) + cTokens;
					slotMap[slotKey].modelCosts[mId] = (slotMap[slotKey].modelCosts[mId] || 0) + cost;

			const hasTotalSeries = totalLineVisible && slots.some(slot => (slotMap[slot].totalTokens || 0) > 0);
			const hasModelSeries = Object.keys(modelSet).some(modelId =>

			if (!hasTotalSeries && !hasModelSeries && !hasCacheSeries) {

			// 3. 计算纵坐标最大刻度 Max Y (同时兼顾模型用量与缓存走势)
			let maxVal = 0;

								dot.setAttribute('cx', pt.x);
								dot.setAttribute('cy', pt.y);
								dot.setAttribute('r', '3.5');
								dot.setAttribute('fill', '#38bdf8');
								dot.setAttribute('stroke', '#1e1e1e');
								dot.setAttribute('stroke-width', '1.5');

							}
						});
					}
				}
			}

			// 5. 绘制各个独立模型的平滑曲线 (Smooth Cubic Bezier)
			const activeModelIds = Object.keys(modelSet);
			const pricingList = PricingManager.loadPricingList();

			activeModelIds.forEach((mId) => {
				if (opt.visibleModels && opt.visibleModels[mId] === false) return;
				if (mId === 'unknown' && opt.visibleModels && Object.values(opt.visibleModels).includes(false) && opt.visibleModels['unknown'] !== true) return;
				let color = '#38bdf8';
				if (mId === 'gemini-flash-aggregate') {
					color = '#00d2ff';
				} else if (mId === 'gemini-3.8-flash') {
					color = '#38bdf8';
				} else if (mId === 'gemini-3.7-flash') {
					color = '#0ea5e9';
				} else if (mId === 'gemini-3.6-flash') {

					color = '#f59e0b';
				} else if (mId === 'claude-opus-4.6') {
					color = '#f43f5e';
				} else if (mId === 'gpt-oss-120b') {
					color = '#10b981';
				} else if (mId === 'unknown') {

					const mInfo = pricingList.find(p => p.id === mId) || DEFAULT_MODEL_PRICING.find(p => p.id === mId);
					if (mInfo && mInfo.color) color = mInfo.color;
				}
				const points = [];
				slots.forEach((s, idx) => {
					const x = padL + idx * xStep;
					const v = slotMap[s].models[mId] || 0;
					const y = padT + plotH * (1 - (v / maxVal));
					points.push({ x, y, val: v, slot: s });
				});

				if (points.length < 1) return;

				let pathD = `M ${points[0].x} ${points[0].y}`;
				for (let i = 0; i < points.length - 1; i++) {
					const curr = points[i];
					const next = points[i + 1];
					const cpX1 = curr.x + (next.x - curr.x) / 3;
					const cpX2 = curr.x + (next.x - curr.x) * 2 / 3;
					pathD += ` C ${cpX1} ${curr.y}, ${cpX2} ${next.y}, ${next.x} ${next.y}`;
				}

				// 面积投影
				const areaD = pathD + ` L ${points[points.length - 1].x} ${padT + plotH} L ${points[0].x} ${padT + plotH} Z`;
				const areaPath = document.createElementNS(svgNS, 'path');
				areaPath.setAttribute('d', areaD);
				areaPath.setAttribute('fill', color);
				areaPath.setAttribute('fill-opacity', '0.08');
				svg.appendChild(areaPath);

				// 折线本体
				const linePath = document.createElementNS(svgNS, 'path');
				linePath.setAttribute('d', pathD);
				linePath.setAttribute('fill', 'none');
				linePath.setAttribute('stroke', color);
				linePath.setAttribute('stroke-width', '2');
				linePath.setAttribute('stroke-linecap', 'round');
				svg.appendChild(linePath);

				// 数据拐点
				if (slots.length <= 15) {
					points.forEach(pt => {
						if (pt.val > 0) {
							const dot = document.createElementNS(svgNS, 'circle');
							dot.setAttribute('cx', pt.x);
							dot.setAttribute('cy', pt.y);
							dot.setAttribute('r', '3');
							dot.setAttribute('fill', color);
							dot.setAttribute('stroke', '#1e1e1e');
							dot.setAttribute('stroke-width', '1.5');
							svg.appendChild(dot);
						}
					});
				}
			});

			// 5.1 同折线图中叠加绘制缓存命中走势 (紫色平滑虚线)
				if (hasCacheSeries) {
				const cachePoints = [];
				slots.forEach((s, idx) => {
					const x = padL + idx * xStep;
					const v = slotMap[s].cacheTokens || 0;
					const y = padT + plotH * (1 - (v / maxVal));
					cachePoints.push({ x, y, val: v, slot: s });
				});

				if (cachePoints.length > 0) {
					let cPathD = `M ${cachePoints[0].x} ${cachePoints[0].y}`;
					for (let i = 0; i < cachePoints.length - 1; i++) {
						const curr = cachePoints[i];
						const next = cachePoints[i + 1];
						const cpX1 = curr.x + (next.x - curr.x) / 3;
						const cpX2 = curr.x + (next.x - curr.x) * 2 / 3;
						cPathD += ` C ${cpX1} ${curr.y}, ${cpX2} ${next.y}, ${next.x} ${next.y}`;
					}

					// 缓存面积微光微阴影
					const cAreaD = cPathD + ` L ${cachePoints[cachePoints.length - 1].x} ${padT + plotH} L ${cachePoints[0].x} ${padT + plotH} Z`;
					const cAreaPath = document.createElementNS(svgNS, 'path');
					cAreaPath.setAttribute('d', cAreaD);
					cAreaPath.setAttribute('fill', '#c084fc');
					cAreaPath.setAttribute('fill-opacity', '0.08');
					svg.appendChild(cAreaPath);

					// 缓存虚线本体
					const cLinePath = document.createElementNS(svgNS, 'path');
					cLinePath.setAttribute('d', cPathD);
					cLinePath.setAttribute('fill', 'none');
					cLinePath.setAttribute('stroke', '#c084fc');
					cLinePath.setAttribute('stroke-width', '2.4');
					cLinePath.setAttribute('stroke-dasharray', '6,4');
					cLinePath.setAttribute('stroke-linecap', 'round');
					svg.appendChild(cLinePath);

					// 缓存拐点
					if (slots.length <= 15) {
						cachePoints.forEach(pt => {
							if (pt.val > 0) {
								const dot = document.createElementNS(svgNS, 'circle');
								dot.setAttribute('cx', pt.x);
								dot.setAttribute('cy', pt.y);
								dot.setAttribute('r', '3');
								dot.setAttribute('fill', '#c084fc');
								dot.setAttribute('stroke', '#1e1e1e');
								dot.setAttribute('stroke-width', '1.5');
								svg.appendChild(dot);
							}
						});
					}
				}
			}

			// 6. 交互指示虚线与 Tooltip 浮层 (展示总消耗、缓存命中与预估费用)
			let tooltip = container.querySelector('.ab-tooltip-box');

			const hoverLine = document.createElementNS(svgNS, 'line');

			hoverLine.setAttribute('y2', padT + plotH);
			hoverLine.setAttribute('stroke', 'rgba(255,255,255,0.35)');
			hoverLine.setAttribute('stroke-dasharray', '2,2');
			hoverLine.style.display = 'none';
			svg.appendChild(hoverLine);

			svg.addEventListener('mousemove', (e) => {
			const rect = svg.getBoundingClientRect();

			if (mouseX < padL || mouseX > padL + plotW) {
				hoverLine.style.display = 'none';
				tooltip.style.display = 'none';
				return;
			}
			const relX = Math.max(0, Math.min(plotW, mouseX - padL));
			const nearestIdx = Math.max(0, Math.min(slots.length - 1, Math.round(relX / xStep)));
			const slotLabel = slots[nearestIdx];
			const slotData = slotMap[slotLabel];

			// 随鼠标连续平滑移动指示线 (在任意横向坐标均平滑展示，彻底告别整点跳帧)
			hoverLine.setAttribute('x1', mouseX);
			hoverLine.setAttribute('x2', mouseX);
			hoverLine.style.display = 'block';

			// 动态计算当前光标所指位置的具体精确时间 (分钟级/整点均能平滑显示)
			let preciseTimeText = slotData.fullDate || slotLabel;

										`<span>⚡ <b style="color:#c084fc;font-weight:600;">${cacheHitRateStr}</b></span>` +

                                  } else {

												  let tipHTML = `<div class="ab-tip-time">${preciseTimeText}</div>`;
												  const totalCachePct = cacheKnown && totalT > 0 ? ((cacheT / totalT) * 100).toFixed(1) + '%' : (cacheKnown ? '0%' : t('unknown_value'));
												  tipHTML += `<div class="ab-tip-row"><span>${t('tooltip_total_tokens')}:</span><span style="color:#38bdf8;font-weight:600;">${formatTokenCount(totalT)} <span style="font-size:10px; color:#94a3b8; font-weight:normal;">(${t('tooltip_input')} ${formatTokenCount(inT)} · ${t('tooltip_output')} ${formatTokenCount(outT)})</span></span></div>`;

												  tipHTML += `<div class="ab-tip-row"><span>💰 ${t('tooltip_est_cost')}:</span><span style="color:#4ade80;font-weight:600;">${costValueStr}</span></div>`;

								  if (pInfo && pInfo.color) color = pInfo.color;
								  let displayVal = formatTokenCount(val);

								  const row = document.createElement('div');

								  tooltip.appendChild(row);
							  }
						  });
					  }
				}

					  tooltip.style.display = 'block';

                                  const tipW = tooltip.offsetWidth || (isMini ? 180 : 210);
                                  const tipH = tooltip.offsetHeight || (isMini ? 36 : 80);
                                  const mouseCssX = e.clientX - rect.left;
                                  const mouseCssY = e.clientY - rect.top;

                                  if (isMini) {

                                          }
                                          tooltip.style.left = Math.max(6, Math.min(rect.width - tipW - 6, leftPos)) + 'px';
                                          tooltip.style.top = '14px';
                                  }
			});

			svg.addEventListener('mouseleave', () => {
				hoverLine.style.display = 'none';
				tooltip.style.display = 'none';

                async refreshChart() {
                        const wrap = document.getElementById('ab-modal-canvas-wrap');
                        if (!wrap) return;
                        const requestSeq = ++this._chartRefreshSeq;
                        const range = this.currentRange;
                        const metric = this.currentMetric;
                        const aggregateFlash = this.aggregateFlash;
                        const visibleModels = { ...this.visibleModels };
                        if (!wrap.querySelector('.ab-chart-svg') && !wrap.querySelector('.ab-chart-status')) {
                                setChartStatus(wrap, 'chart_loading');
                        }
                        let records;
                        try {
                                records = await AnalyticsStorage.queryRange(range);
                        } catch (error) {
                                console.error('[AB Analytics] 图表刷新失败:', error);
                                if (requestSeq === this._chartRefreshSeq) setChartStatus(wrap, 'chart_failed', error && error.message);
                                return;
                        }
                        if (requestSeq !== this._chartRefreshSeq) return;
                        try {
                                SvgChartEngine.render(wrap, records, {
                                        range,
                                        metric,
                                        aggregateFlash,
                                        visibleModels
                                });
                        } catch (error) {
                                console.error('[AB Analytics] 图表渲染失败:', error);
                                setChartStatus(wrap, 'chart_render_failed', error && error.message);
                                return;
                        }

                        // 刷新底部汇总统计 (严格采用包含缓存的全量 Tokens 口径，与主卡片及每日明细表 100% 同步一致)
			const foot = document.getElementById('ab-modal-trends-foot');
			if (foot) {
				let totalTok = 0, totalIn = 0, totalCache = 0, totalCost = 0;
				let hasExplicitUnknownCache = false, costKnown = true;
					(records || []).forEach(raw => {
						const r = AnalyticsStorage.normalizeRecord(raw);
						const inT = r.inTokens || 0;
						const outT = r.outTokens || 0;
						const cTokens = r.cacheTokens || 0;
						const tTokens = r.totalTokens ? r.totalTokens : (inT + outT);
						totalTok += tTokens;
						totalIn += inT;
						totalCache += cTokens;
						totalCost += (r.costUsd || 0);
						if (r.cacheKnown === false && !(cTokens > 0)) hasExplicitUnknownCache = true;
						if (r.costKnown === false) costKnown = false;
					});
				const cacheKnown = totalCache > 0 || !hasExplicitUnknownCache;
				const cacheRate = cacheKnown ? calcCacheHitRate(totalCache, totalTok, totalIn) : t('unknown_value');
				const cacheValue = cacheKnown ? formatTokenCount(totalCache) : t('unknown_value');
				const costValue = '$' + totalCost.toFixed(4) + (costKnown ? '' : t('known_subtotal_suffix'));
				safeSetHTML(foot, '<div>' + t('stats_view_prefix') + '<b>' + (records ? records.length : 0) + '</b>' + t('stats_view_turns') + '</div>' +
					'<div style="display:flex;gap:18px;">' +

						'<span>' + t('stats_cache_tokens') + '<b>' + cacheValue + '</b>' + t('stats_hit_rate') + cacheRate + ')</span>' +
						'<span>' + t('stats_cost') + '<b>' + costValue + '</b></span>' +
					'</div>');
			}

                openConfirmDialog(type = 'all', onDone = null) {
                        if (this._confirmTimer) {
                                clearTimeout(this._confirmTimer);
                                this._confirmTimer = null;
                        }
                        if (this._confirmKeyHandler) {
                                document.removeEventListener('keydown', this._confirmKeyHandler);
                                this._confirmKeyHandler = null;
                        }
                        let cfOv = document.getElementById('ab-analytics-confirm-overlay');
                        if (!cfOv) {
                                cfOv = el('div'); cfOv.id = 'ab-analytics-confirm-overlay';
                                document.body.appendChild(cfOv);
                        }
                        while (cfOv.firstChild) cfOv.removeChild(cfOv.firstChild);
                        const cfModal = el('div'); cfModal.id = 'ab-analytics-confirm-modal';

                        const closeConfirm = () => {
                                if (this._confirmTimer) {
                                        clearTimeout(this._confirmTimer);
                                        this._confirmTimer = null;
                                }
                                cfOv.classList.remove('visible');
                                this._confirmTimer = setTimeout(() => {
                                        cfOv.classList.remove('show');
                                        cfOv.style.display = 'none';
                                        this._confirmTimer = null;
                                }, 200);
                                document.removeEventListener('keydown', onKeyDown);
                                if (this._confirmKeyHandler === onKeyDown) this._confirmKeyHandler = null;
                        };

                        const onKeyDown = (e) => {
                                if (e.key === 'Escape' && cfOv.classList.contains('show')) {
                                        closeConfirm();
                                }
                        };
                        this._confirmKeyHandler = onKeyDown;
                        document.addEventListener('keydown', onKeyDown);

                        cfOv.onclick = (e) => {
                                if (e.target === cfOv) closeConfirm();
                        };

                        const isToday = type === 'today';
                        const cfTitle = el('div', 'ab-danger-title', isToday ? t('clear_today_title') : t('clear_all_title'));
                        const cfBody = el('div', 'ab-danger-body', isToday ? t('clear_today_desc') : t('clear_all_desc'));
                        const cfActions = el('div', 'ab-danger-actions');
                        const cancelBtn = el('button', 'ab-btn secondary', t('btn_cancel'));
                        const confirmBtn = el('button', 'ab-btn ab-btn-danger', isToday ? t('btn_confirm_clear_today') : t('btn_confirm_clear_all'));
                        confirmBtn.style.background = '#dc2626';

                        cancelBtn.addEventListener('click', () => {
                                closeConfirm();
                        });
                        confirmBtn.addEventListener('click', async () => {
                                let cleared = false;
                                try {
                                        if (typeof TokenTracker !== 'undefined' && TokenTracker.invalidateNetworkWrites) {
                                                TokenTracker.invalidateNetworkWrites();
                                        }
                                        cleared = isToday ? await AnalyticsStorage.clearToday() : await AnalyticsStorage.clearHistory();
                                } catch (error) {
                                        console.error('[AB Analytics] 清空用量事件失败:', error);
                                }
                                closeConfirm();
                                if (!cleared) {
                                        if (window._abShowToast) window._abShowToast(t('toast_clear_failed'), { warn: true });
                                        return;
                                }
                                if (!isToday) {
                                        TokenTracker.clearCache();
                                        TokenTracker.markCurrentDOMTracked();
                                        if (window._abShowToast) window._abShowToast(t('toast_all_cleared'), { warn: true });
                                } else {
                                        TokenTracker.markCurrentDOMTracked();
                                        if (window._abShowToast) {
                                        window._abShowToast(t('toast_today_cleared'));
                                        }
                                }
                                if (typeof onDone === 'function') {
                                        try { await onDone(); } catch (error) {
                                                console.error('[AB Analytics] 清空后回调失败:', error);
                                        }
                                }
                        });

                        cfActions.appendChild(cancelBtn);
                        cfActions.appendChild(confirmBtn);
                        cfModal.appendChild(cfTitle);
                        cfModal.appendChild(cfBody);
                        cfModal.appendChild(cfActions);
                        cfOv.appendChild(cfModal);

                        cfOv.style.display = 'flex';
                        cfOv.classList.add('show');
                        requestAnimationFrame(() => cfOv.classList.add('visible'));
                }

			// 1. 全局会话切换/新建点击捕获监听。
			// Capture 阶段只重置插件状态；不要在宿主 DOM 卸载前扫描或滚动，
			// 否则会与 Antigravity 的会话加载竞争主线程和虚拟列表。
			document.addEventListener('click', (ev) => {
				const target = ev.target;
				if (!target || !target.closest) return;
				const isSessionTrigger = target.closest('[data-testid*="conversation"], [class*="conversation-item"], [aria-label*="New Chat"], [aria-label*="新建对话"], [data-tooltip-id*="new-chat"], button[title*="New"], button[title*="新建"], button[aria-label*="New"]');

					try {
						this.resetSessionTracking(500);
						const generation = this.sessionGeneration;
						this.sessionSwitchTimer = setTimeout(async () => {
							if (this.sessionGeneration !== generation) return;
							this.sessionSwitchTimer = null;
							try {
								await this.scanConversationTurns();
								await AnalyticsStorage.recalculateSummary();

								if (typeof window._abRenderPreviewChart === 'function') window._abRenderPreviewChart();

								console.warn('[AB Analytics] 会话切换后的扫描失败:', error);
							}
						}, 550);
					} catch (e) {}
				}
			}, true);

			// 2. 页面卸载、切后台及关闭时兜底补扫与持久化
			window.addEventListener('beforeunload', () => {
				try { this.scanConversationTurns(); } catch (e) {}
			});
			window.addEventListener('pagehide', () => {
				try { this.scanConversationTurns(); } catch (e) {}
			});
			document.addEventListener('visibilitychange', () => {
				if (document.visibilityState === 'hidden') {

				}
			});
		},
		initHashes() {
			try {
				const raw = localStorage.getItem(this.STORAGE_KEY_HASHES);
				if (raw) {
					const arr = JSON.parse(raw);
					if (Array.isArray(arr)) this.processedHashes = new Set(arr);
				}
			} catch(e) {}
			try {
				const rawStates = localStorage.getItem(this.STORAGE_KEY_TURN_STATES);
				const states = rawStates ? JSON.parse(rawStates) : null;
				if (states && typeof states === 'object' && !Array.isArray(states)) {
					Object.entries(states).forEach(([key, value]) => {
						if (!value || typeof value !== 'object') return;
						const inTokens = Number(value.inTokens);
						const outTokens = Number(value.outTokens);
						const cacheTokens = Number(value.cacheTokens);
						if (Number.isFinite(inTokens) && Number.isFinite(outTokens) && Number.isFinite(cacheTokens)) {
							this.trackedTurnStates.set(key, {
								inTokens: Math.max(0, inTokens),
								outTokens: Math.max(0, outTokens),
								cacheTokens: Math.max(0, cacheTokens),
								signature: typeof value.signature === 'string' ? value.signature : ''
							});
						}
					});
				}
			} catch(e) {}
		},

		saveHashes() {
			try {
				const arr = Array.from(this.processedHashes);
				// 2,000 条会在长会话/全量补扫中很快淘汰旧轮次，导致
				// 虚拟列表再次挂载时重复计量。哈希很小，保留 100,000 条
				// 仍远低于常见 localStorage 配额，并覆盖实际长会话。
				const slice = arr.length > 100000 ? arr.slice(arr.length - 100000) : arr;
				localStorage.setItem(this.STORAGE_KEY_HASHES, JSON.stringify(slice));
			} catch(e) {}
			try {
				const entries = Array.from(this.trackedTurnStates.entries());
				// 状态值只保存短哈希和三个累计整数；限制大小，避免占满
				// localStorage。没有状态的旧哈希仍可继续做精确签名去重。
				const stateSlice = entries.length > 20000 ? entries.slice(entries.length - 20000) : entries;
				const stateObj = {};
				stateSlice.forEach(([key, value]) => { stateObj[key] = value; });
				localStorage.setItem(this.STORAGE_KEY_TURN_STATES, JSON.stringify(stateObj));
			} catch(e) {}
		},

		markCurrentDOMTracked() {
			const panel = document.querySelector('.antigravity-agent-side-panel');
			if (!panel) return;
			const chatContainer = panel.querySelector('.relative.flex.flex-col.gap-y-3.px-4, [class*="gap-y-3"][class*="px-4"]') || panel;
			const turns = chatContainer === panel ? Array.from(panel.children) : Array.from(chatContainer.children);
			// 导入历史 JSON 前，使用与正常扫描完全相同的会话指纹和轮次
			// 签名，避免当前 DOM 在导入后被再次作为估算值计入。
			if (!this.currentSessionFingerprint) {
				const fingerprintTurns = turns.map(turnNode => {
					if (!turnNode || !turnNode.querySelector) return null;
					const userEl = turnNode.querySelector('.bg-gray-500\\/15, [class*="bg-gray-500/15"], .bg-gray-500\\/20');
					return userEl ? { node: turnNode, userEl } : null;
				}).filter(Boolean);
				this.currentSessionFingerprint = this.getSessionFingerprint(panel, chatContainer, fingerprintTurns);
			}
			for (let i = 0; i < turns.length; i++) {
				const turnNode = turns[i];
				if (!turnNode || !turnNode.querySelector) continue;
				const userEl = turnNode.querySelector('.bg-gray-500\\/15, [class*="bg-gray-500/15"], .bg-gray-500\\/20');
				const thinkEl = turnNode.querySelector('.opacity-70.leading-relaxed, [class*="opacity-70"][class*="leading-relaxed"]');
				const aiEl = turnNode.querySelector('.leading-relaxed.select-text:not(.opacity-70), [class*="leading-relaxed"][class*="select-text"]:not([class*="opacity-70"])');
				if (!aiEl && !userEl) continue;

				const uText = userEl ? (userEl.textContent || '').trim() : '';
				const thText = thinkEl ? (thinkEl.textContent || '').trim() : '';
				const aiText = aiEl ? (aiEl.textContent || '').trim() : '';
					const contentRoots = [userEl, thinkEl, aiEl].filter(Boolean);
					const rawActionEls = turnNode.querySelectorAll ? Array.from(turnNode.querySelectorAll('pre, [class*="terminal"], [class*="output"], [data-testid*="tool"], [class*="tool"], [data-artifact-id]')).filter(el => !contentRoots.some(root => root.contains(el) || el.contains(root))) : [];
				const actionEls = rawActionEls.filter(el => !rawActionEls.some(parent => parent !== el && parent.contains(el)));
				let toolText = '';
				const seenToolText = new Set();
					actionEls.forEach(el => {
						const text = (el.textContent || '').trim();
						const key = text ? this.hashString(text) : '';
						if (key && !seenToolText.has(key)) { seenToolText.add(key); toolText += '\n' + text; }
					});
				const turnIdentity = this.buildTurnIdentity(turnNode, uText, aiText);
				const sig = this.buildTurnSignature(uText, thText, aiText, toolText, turnIdentity);
				const userTokens = this.estimateTokens(uText);
				const toolTokens = this.estimateTokens(toolText);
				const inTokens = userTokens + toolTokens;
				const thinkTokens = this.estimateTokens(thText);
				const compTokens = this.estimateTokens(aiText);
				const outTokens = thinkTokens + compTokens;
				this.trackedTurnStates.set(turnIdentity, {
					inTokens, outTokens, cacheTokens: 0, signature: sig
				});
				this.processedHashes.add(sig);

					const keyNode = aiEl || userEl || turnNode;
					keyNode.dataset.abTrackedId = '1';
					keyNode.dataset.abTrackedSignature = sig;
					keyNode.dataset.abTrackedIdentity = turnIdentity;
					keyNode.dataset.abInTokens = String(inTokens);
					keyNode.dataset.abOutTokens = String(outTokens);
					keyNode.dataset.abCacheTokens = '0';
					if (aiEl) aiEl.dataset.abTrackedId = '1';
					if (userEl) userEl.dataset.abTrackedId = '1';
			}
			this.saveHashes();
		},

		invalidateNetworkWrites() {
			// 清理用量时同时切断所有尚未完成的 provider 写入；旧 promise
			// 会因 generation 不匹配而自动清理，不能在清空后又把旧账单写回来。
			this.sessionGeneration++;
			this.networkUsageSeen = false;
			this.networkUsageKeys.clear();
			this.networkUsageSeenAt = 0;
			this.networkUsageSavedAt = 0;
			this.networkUsagePendingSaves.clear();
			this.networkOutputTexts = [];
		},

		clearCache() {
			this.invalidateNetworkWrites();
			this.processedHashes.clear();
			this.trackedTurnStates.clear();
			this.pendingTurnStates.clear();
			try { localStorage.removeItem(this.STORAGE_KEY_HASHES); } catch(e) {}
			try { localStorage.removeItem(this.STORAGE_KEY_TURN_STATES); } catch(e) {}

				panel.querySelectorAll('[data-ab-tracked-id]').forEach(el => {

					delete el.dataset.abCacheTokens;
					delete el.dataset.abIsEstimate;
